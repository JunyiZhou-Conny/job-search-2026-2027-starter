# Polar writes incident_log.repeat_key through polar_policy.canonical_repeat_key.
# New failure modes may introduce a new canonical key. Do not invent aliases
# for a key that already exists.
repeat_keys:
  agent_start_unverified:
    meaning: "Jobright Agent Start is available and whether Start auto-submits is unknown. Polar must not press Start. BLOCK that job only when Apply Now is unreachable without Start."
  jobright_matches_onboarding_gate:
    meaning: "Authenticated Jobright Matches (/jobs/recommend) mandatory resume-upload onboarding wall"
    aliases:
      - jobright_onboarding_required
      - jobright_onboarding_gate
      - jobright_onboarding_resume_upload_gate
      - jobright_onboarding_resume_gate
      - jobright_onboarding_resume_required
      - jobright_onboarding_resume_upload
  degree_level_gate_missed_at_discovery:
    meaning: "Exclusive PhD-only or undergraduate-only gate visible on the full JD, missed at discovery"
    aliases:
      - phd_only_missed_at_discovery
      - phd_only_gate_missed_at_discovery
      - undergrad_only_gate_missed_at_discovery
  control_key_duplicate:
    meaning: "Two Sheet control-tab rows share one key. Polar must abort that write, not guess."
    aliases:
      - control_duplicate_key
      - control_duplicate_key_env_simplify_copilot
  native_resume_empty:
    meaning: "Employer native resume widget is empty and Perfect Resume could not be attached from Polar/Simplify or the identified file. Copilot sidebar Completed is not proof."
  copilot_academic_mailbox_on_application_field:
    meaning: "A parser put the academic mailbox on a normal ATS account or contact field. Historical Copilot name. Jobright-era apply still corrects the field."
  invented_referral:
    meaning: "Autofill invented a referral source such as Event. Clear it. Do not invent a referral."
  autofill_nickname_on_legal_first_name:
    meaning: "Autofill wrote the nickname Conny into a legal First Name field. Repair to the legal first name. Upstream candidate fix is the Jobright profile name field or the generated resume header, an owner action. Do not encode an endless per-form rewrite."
  autofill_sponsorship_yes_on_future_sponsorship_widget:
    meaning: "Retired 2026-09-16. Autofill Yes on a future-sponsorship widget is now correct. Do not treat Yes as a defect. Use autofill_sponsorship_no_on_future_sponsorship_widget when No was forced. 2026-09-15 meaning: Autofill or a later correction set Yes; the standing answer was then No."
  autofill_sponsorship_no_on_future_sponsorship_widget:
    meaning: "Autofill or a later correction set No on a future-sponsorship widget. The standing answer is Yes as of 2026-09-16. Forcing No is the defect. Retired 2026-09-15 when the standing answer was No; restored 2026-09-16."
  mailbox_unreadable_stale:
    meaning: "A local PREFERENCES or jobright.ai site note still says the application mailbox cannot be read. GitHub says Polar may retrieve verification codes via the application Outlook inbox."
  submit_success_without_page_confirmation:
    meaning: "A run claimed SUCCESS or SUBMITTED without employer-page confirmation plus matching queue readback."
  duplicate_job_key:
    meaning: "Two or more queue rows share one job_key. Abort that job. Do not claim. Do not Submit. Do not guess which row. Incident category QUEUE_STATE."
  sheet_query_na:
    meaning: "A targeted Sheet QUERY returned #N/A, #REF!, or another error token. Treat as a lookup miss. Do not create a scratch tab or dump the queue."
  # Shared with the Grok Bot sibling executor (knowledge/grokbot_operator.yaml).
  # Grok writes the same queue, run_log, incident_log, and writing_log tabs
  # with G- run ids and run_log.workflow grok-apply-jobs. No Grok-only tab.
  ats_prior_submission:
    meaning: "Employer ATS shows this applicant account already submitted for the requisition. SKIP with blocker already_applied_on_ats. No fill, no Submit. Jobright ack permitted (owner 2026-09-15)."
  grok_sheet_unreachable:
    meaning: "Grok Bot computer could not read or write Polar Jobs during a run that had google_sheets at start. Fill-only, no Submit, no invented state."
  grok_extension_missing:
    meaning: "Jobright autofill extension is absent from the Grok Bot browser, for example after Update or Recover. Autofill cannot run. Do not type identity by hand to fake it."
  grok_cache_checksum_mismatch:
    meaning: "A file under the Grok Bot resource cache is missing or its sha256 does not match the compiled GROKBOT_RUNTIME document row. Refetch from raw main. Never attach a mismatched file."
  grok_approval_stop:
    meaning: "Auto Review or an approval prompt stopped an unattended Grok Bot routine step. Counted per day so overnight Submit confidence is measured, not assumed."

