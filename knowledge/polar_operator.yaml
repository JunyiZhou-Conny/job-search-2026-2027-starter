last_updated: "2026-09-15"
policy_revision: "2026-09-15.fast-validation"
source: "Owner 2026-09-15. Jobright-era apply. Jobright owns discovery, resume generate, extension autofill, and generated writing. Polar runs a fast validation pass on the form DOM (identity, work authorization, eligibility-critical, required-empty-or-error, required legal), repairs anomalies, retrieves Outlook verification codes, confirms on the employer page, then acks Jobright. Sheet blocked/submitted/unknown memory stays. Full-queue reads, Copilot-as-autofill, and full-form audits do not. PREFERENCES stays thin. google_sheets is Google-connector reach to Polar Jobs, not a connector title."
timezone: "America/New_York"
apply_entry: jobright_recommendations
autofill:
  owner: jobright_extension
  default_filler: jobright_extension
  polar_role: anomaly_detection_and_targeted_repair
  max_attempts_per_form: 1
  do_not_use_simplify_copilot: true
  trust: form_dom
  sidebar_is_proof: false
  full_form_audit: false
  # The five high-risk classes Polar verifies after Autofill. Nothing else
  # is re-read line by line. polar_policy.POST_AUTOFILL_CHECKS is the same
  # list for engineers.
  post_autofill_checks:
    - identity
    - work_authorization
    - eligibility_critical
    - required_empty_or_error
    - required_legal_compliance
  fast_validation_pass:
    source: >
      Owner 2026-09-15 after production run R-20260914-2309 (3/3
      submitted, about 85 minutes, about 28 minutes per application).
      The slow part was a post-Autofill full-form audit. Autofill is
      imperfect (nickname on First Name, sponsorship No, blanks), so
      Autofill then blind Submit is not allowed either.
    meaning: >
      Jobright Autofill is the default filler. Polar is anomaly detection
      and targeted repair. After Autofill, Polar verifies only the
      post_autofill_checks classes on the employer form DOM. A populated
      widget with no validation error and no known failure class is
      trusted. A routine Greenhouse, Ashby, or SmartRecruiters form
      should take single-digit to low-teens minutes.
    verify:
      identity:
        widgets: [first_name, last_name, application_email]
        rule: >
          Legal first and last name from config/profile.yaml. Normal
          email fields show the local APPLICATION mailbox. No full
          profile audit.
      work_authorization:
        # Exactly polar_policy.AUTH_QUESTION_KINDS minus unknown. The
        # compiler refuses a shorter or renamed list.
        widgets:
          - citizenship
          - visa_status
          - status_yes_no
          - current_work_authorization
          - authorization_at_start
          - authorized_for_any_employer
          - authorization_without_sponsorship
          - sponsorship_to_begin
          - future_sponsorship
          - h1b_sponsorship
          - opt_eligibility
          - opt_approval
          - ead_possession
          - work_authorization_wording
          - country_specific_sponsorship
        rule: >
          These are every kind polar_policy.auth_form_action classifies.
          Re-read each present widget of these kinds even when Autofill
          populated it. knowledge/work_authorization.yaml stays
          authoritative. Classify the exact question with
          polar_policy.auth_form_action and answer only that semantic.
          Required currently-authorized or sponsorship-to-begin with an
          unknown fact: leave the field and BLOCK that job only. Optional
          widgets of these kinds stay blank; clear a guessed value when
          the widget allows it, and if it cannot be cleared the value
          must match auth_form_action or the job is BLOCKED. Do not fill
          unasked OPT, EAD, or immigration widgets.
      eligibility_critical:
        widgets:
          - enrollment_status
          - graduation_timing
          - internship_eligibility
          - work_location_or_relocation
          - minimum_age
          - security_clearance
          - citizenship_when_genuinely_relevant
        rule: >
          Only widgets that decide eligibility for this role. Not every
          generic question.
      required_empty_or_error:
        signals:
          - required_but_empty
          - validation_error
          - unanswered_required_radio
          - required_combobox_left_at_select
          - jobright_sidebar_complete_but_employer_dom_empty
        rule: >
          Employer DOM is truth. Fill from section A facts or leave for
          Junyi and BLOCK that job only. Never invent.
      required_legal_compliance:
        widgets:
          - required_attestation
          - required_consent_checkbox
          - required_export_control
          - required_automated_script_declaration
        rule: >
          Only when the widgets exist and are required on this form. Do
          not generalize one employer's seven compliance questions to
          every form.
    trust_when_populated_no_error_no_known_failure:
      - eeo_demographics
      - phone_address_formatting
      - resume_filename
      - populated_education_employment
      - routine_non_material
    trust_exception: >
      A visible conflict with known candidate truth, seen in passing, is
      repaired and noted. Polar does not go looking for one.
    do_not:
      - re-read every populated widget after Autofill
      - re-verify gender, race, ethnicity, veteran, or disability after Autofill
      - reproduce Jobright profile filling by hand
      - distrust all Autofill output by default
      - walk the section A standing-answer list against populated widgets
    known_failure_classes:
      nickname_on_legal_first_name:
        observed: "Owner-observed 2026-09-15, production run R-20260914-2309"
        wrong_value: "Conny"
        repair: "First Name is the legal first name from config/profile.yaml."
        upstream_candidate: "Jobright profile name field or generated resume header. Owner action."
        upstream_status: unknown
        repeat_key: autofill_nickname_on_legal_first_name
      sponsorship_no_on_future_sponsorship_widget:
        observed: "Jobright-era apply 2026-09-15"
        wrong_value: "No"
        repair: "future_sponsorship_required is true. Required widget answer is Yes. polar_policy.auth_form_action."
        upstream_candidate: "Jobright profile sponsorship setting. Owner action."
        upstream_status: unknown
        repeat_key: autofill_sponsorship_no_on_future_sponsorship_widget
      academic_mailbox_on_application_field:
        wrong_value: "academic mailbox"
        repair: "Local APPLICATION mailbox. polar_policy.contact_email_action."
        repeat_key: copilot_academic_mailbox_on_application_field
      invented_referral:
        observed: "Jobright-era apply 2026-09-15"
        wrong_value: "Event"
        repair: "Blank unless a verified referral fact exists. polar_policy.referral_field_action."
        repeat_key: invented_referral
      citizenship_not_china:
        observed: "Copilot on Twitch 2026-09-03, pre-Jobright"
        wrong_value: "United States"
        repair: "China."
    form_complexity:
      routine_is_default: true
      complex_signals:
        - account_or_otp_required
        - workday_or_eightfold_multistep
        - large_compliance_block
        - nontrivial_writing
        - unusual_eligibility
      rule: >
        Extra care only when a complex signal is actually on the form.
        Routine forms take the fast path.
    timing:
      routine_form_minutes: "single digits to low teens"
      three_routine_apps_minutes: "30 to 40"
      is_timeout: false
      baseline: "R-20260914-2309: 3/3 submitted in about 85 minutes"
    corrections_log:
      run_log_notes_token: autofill_corrections
      granularity: one_incident_per_class_per_run
      per_widget_incidents: false
