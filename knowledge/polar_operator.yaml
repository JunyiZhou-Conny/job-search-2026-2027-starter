last_updated: "2026-09-15"
policy_revision: "2026-09-15.sheets-capability"
source: "Owner 2026-09-15. Jobright-era apply. Jobright owns discovery, resume generate, extension autofill, and generated writing. Polar validates the form DOM, finishes remaining fields, retrieves Outlook verification codes, confirms on the employer page, then acks Jobright. Sheet blocked/submitted/unknown memory stays. Full-queue reads and Copilot-as-autofill do not. PREFERENCES stays thin. google_sheets is Google-connector reach to Polar Jobs, not a connector title."
timezone: "America/New_York"
apply_entry: jobright_recommendations
autofill:
  owner: jobright_extension
  max_attempts_per_form: 1
  do_not_use_simplify_copilot: true
  trust: form_dom
  sidebar_is_proof: false
  post_autofill_checks:
    - identity
    - contact
    - sponsorship_wording
    - referral
legacy_ready_rows:
  disposition: inventory_only
  owner: polar_policy.legacy_ready_disposition
  removal_condition: "Remove this shim after Jobright-era apply is the loaded main compile and no run treats READY_* as silent FIFO."
queue_read:
  default: targeted
  full_scan: false
  lookup:
    - job_key
    - company_role_location
    - status_blocked_submitted_unknown
  recovery_filter:
    - SUBMISSION_UNKNOWN
    - IN_PROGRESS
  do_not_dump_ready_backlog: true
application_mailbox:
  readable: true
  source: browser_outlook_application_inbox
  verification_codes: retrieve_and_continue
  abandon_on_email_otp: false
  user_only_steps:
    - sms_on_mac_if_outlook_has_no_code
    - hardware_security_key
    - captcha_after_normal_attempt
    - phone_app_push
  stale_local_sources:
    - /home/polar/PREFERENCES.md
    - Polar site notes on jobright.ai
learning:
  current_era: jobright
  fence_pre_jobright_incidents: true
  fence:
    - simplify_probe_or_fallback
    - copilot_as_autofill
    - ready_fifo
    - ibm_funnel_jobs_jobright_does_not_recommend
  do_not_paste_architecture_audit: true

writing_observation_mode: true

canary:
  max_jobs_per_run: 3
  reserved_priority_slots_per_run: 0
  prioritized_auto_submit: true

lease:
  tab: control
  key: polar_browser

work_claim:
  tab: queue
  owner_field: claim_run_id
  ttl_minutes: 180

simplify:
  role: retired_from_apply_path
  proof: not_an_apply_gate
  not_proof:
    - simplify_jobs_website_login
    - simplify_jobs_api
    - copilot_sidebar
  max_attempts_per_application: 0
  silent_manual_fallback: false
  missing_action: continue
  consume_job: false
  control_key: env_simplify_copilot
  control_key_disposition: archive
  states:
    - PRESENT
    - MISSING
    - UNKNOWN

memory:
  canonical: github
  local_inbox: /home/polar/PREFERENCES.md
  local_inbox_is_not_strategy: true
  resolution_file: knowledge/preference_resolutions.yaml
  candidate_id: pref_YYYYMMDD_NNN
  export: production-learning-daily
  decide: cursor-production-maintenance
  canonical_gate: github_main
  reconcile: next_polar_invocation
  precedence:
    - owner_instruction
    - canonical_github
    - local_private
    - learning_candidate

contact_email:
  default_source: local_application_mailbox
  academic_source: local_academic_mailbox
  academic_when:
    - school email
    - university email
    - institutional email
  resume_parser_is_not_authoritative: true

street_address:
  source: local_polar_private_profile
  do_not_compile_value: true

schedules:
  discover_jobs_hourly:
    workflow: discover-jobs-hourly
    cron_et: "0 * * * *"
    meaning: "Retired from apply admission. Optional inventory only if invoked. Not the apply entry."
    enabled: false
    apply_path: false
    needs_browser_lock: false
    polar_mode: "Saved Polar Workflow. Off the default apply path. Inventory and dedupe only if someone runs it."
  apply_ready_jobs:
    workflow: apply-ready-jobs
    cron_et: "20 * * * *"
    meaning: "Every hour at minute 20 Eastern Time. Starts on Jobright recommendations. Sheet READY_* is not the source."
    enabled: true
    needs_browser_lock: false
    polar_mode: "Saved Polar Workflow on the same named local browser profile. Jobright-first application execution."
  daily_job_summary:
    workflow: daily-job-summary
    cron_et: "30 21 * * *"
    meaning: "Once each evening at 21:30 Eastern Time"
    enabled: true
    needs_browser_lock: false
    polar_mode: "Saved Polar Workflow. Queue read and one email. No application clicks."
  production_learning_daily:
    workflow: production-learning-daily
    cron_et: "0 22 * * *"
    meaning: "Once each evening at 22:00 Eastern Time"
    enabled: true
    needs_browser_lock: false
    polar_mode: "Saved Polar Workflow. Sheet read and one sanitized learning report. No application clicks."
  scheduler_heartbeat:
    workflow: polar-scheduler-heartbeat
    cron_et: "5 * * * *"
    meaning: "Harmless locked-screen proof. Every hour at minute 05 Eastern Time until the owner records a result."
    enabled: true
    needs_browser_lock: false
    polar_mode: "Saved Polar Workflow. Open a harmless page. Write one Sheet row. Never apply."
  polar_github_write_canary:
    workflow: polar-github-write-canary
    cron_et: ""
    meaning: "Manual one-time proof that Polar can open a harmless GitHub Issue."
    enabled: false
    needs_browser_lock: false
    polar_mode: "Manual. Do not schedule until the owner pastes it once."
  chatgpt_production_review:
    workflow: chatgpt-production-review
    cron_et: ""
    meaning: "Optional later bridge. Disabled until the GitHub write path and ChatGPT handoff are proven."
    enabled: false
    needs_browser_lock: false
    polar_mode: "Disabled. Manual only after proof."
  cursor_production_maintenance:
    workflow: cursor-production-maintenance
    cron_et: ""
    meaning: "Optional later Cursor maintenance. Disabled until the browser handoff is proven. Never merge."
    enabled: false
    needs_browser_lock: false
    polar_mode: "Disabled. Manual only after proof. Stop before merge."
  polar_sheet_migration:
    workflow: polar-sheet-migration
    cron_et: ""
    meaning: "One-time Sheet tab and header migration."
    enabled: false
    needs_browser_lock: false
    polar_mode: "Manual once. Preserve existing queue, writing_log, and heartbeat rows."

statuses:
  - NEW
  - READY_REGULAR
  - READY_PRIORITY
  - IN_PROGRESS
  - REVIEW_READY
  - SUBMITTED
  - SUBMISSION_UNKNOWN
  - BLOCKED
  - SKIP

last_stages:
  - discovered
  - source_resolved
  - application_open
  - authenticated
  - form_filled
  - reviewed
  - submit_clicked
  - confirmation_seen
  - jobright_ack

recovery_order:
  - SUBMISSION_UNKNOWN
  - IN_PROGRESS

queue_columns:
  - job_key
  - discovered_at
  - company
  - role
  - location
  - track
  - source_url
  - apply_url
  - apply_url_confidence
  - weight
  - priority_reason
  - lane
  - resume_cluster
  - status
  - last_stage
  - attempt_count
  - blocker
  - writing_summary
  - submitted_at
  - confirmation
  - updated_at
  - employer_requisition_id
  - ats_job_id
  - claim_run_id

writing_log_columns:
  - job_key
  - company
  - role
  - weight
  - exact_question
  - answer_used
  - evidence_note
  - recorded_at

heartbeat_columns:
  - recorded_at
  - workflow
  - result
  - page_opened
  - notes

run_log_columns:
  - run_id
  - workflow
  - workflow_version
  - started_at
  - ended_at
  - duration_minutes
  - result
  - lock_result
  - jobs_seen
  - jobs_attempted
  - submitted_regular
  - submitted_priority
  - blocked
  - skipped
  - submission_unknown
  - simplify_attempted
  - simplify_fallback_count
  - notes

incident_log_columns:
  - incident_id
  - run_id
  - job_key
  - company
  - stage
  - category
  - time_lost_category
  - severity
  - summary
  - evidence
  - minutes_lost
  - resolved_in_run
  - repeat_key
  - durable_candidate
  - recorded_at

control_columns:
  - key
  - owner_run_id
  - workflow
  - acquired_at
  - expires_at
  - notes

learning_reports_columns:
  - report_date
  - recorded_at
  - workflow_version
  - body_markdown
  - publish_status
  - github_url
  - notes

# Polar writes incident_log.repeat_key through polar_policy.canonical_repeat_key.
# New failure modes may introduce a new canonical key. Do not invent aliases
# for a key that already exists.
repeat_keys:
  jobright_matches_onboarding_gate:
    meaning: "Authenticated Jobright Matches (/jobs/recommend) mandatory resume-upload onboarding wall"
    aliases:
      - jobright_onboarding_required
      - jobright_onboarding_gate
      - jobright_onboarding_resume_upload_gate
      - jobright_onboarding_resume_gate
      - jobright_onboarding_resume_required
      - jobright_onboarding_resume_upload
  degree_level_gate_missed_at_discovery:
    meaning: "Exclusive PhD-only or undergraduate-only gate visible on the full JD, missed at discovery"
    aliases:
      - phd_only_missed_at_discovery
      - phd_only_gate_missed_at_discovery
      - undergrad_only_gate_missed_at_discovery
  control_key_duplicate:
    meaning: "Two Sheet control-tab rows share one key. Polar must abort that write, not guess."
    aliases:
      - control_duplicate_key
      - control_duplicate_key_env_simplify_copilot
  native_resume_empty:
    meaning: "Employer native resume widget is empty and Perfect Resume could not be attached from Polar/Simplify or the identified file. Copilot sidebar Completed is not proof."
  copilot_academic_mailbox_on_application_field:
    meaning: "A parser put the academic mailbox on a normal ATS account or contact field. Historical Copilot name. Jobright-era apply still corrects the field."
  invented_referral:
    meaning: "Autofill invented a referral source such as Event. Clear it. Do not invent a referral."
  mailbox_unreadable_stale:
    meaning: "A local PREFERENCES or jobright.ai site note still says the application mailbox cannot be read. GitHub says Polar may retrieve verification codes via the application Outlook inbox."
  submit_success_without_page_confirmation:
    meaning: "A run claimed SUCCESS or SUBMITTED without employer-page confirmation plus matching queue readback."

incident_categories:
  - UI_ONE_OFF
  - LOCAL_PRIVATE_FACT
  - MISSING_DOCUMENT
  - MISSING_FACT
  - FACT_POLICY
  - TRIAGE
  - QUEUE_STATE
  - DEDUP
  - WRITING
  - AUTH
  - PERFORMANCE
  - ENVIRONMENT
  - NO_ACTION

time_lost_categories:
  - AUTH
  - ACCOUNT_CREATION
  - SIMPLIFY
  - MISSING_FACT
  - MISSING_DOCUMENT
  - WRITING
  - DROPDOWN_UI
  - DUPLICATE
  - SUBMIT_VERIFY
  - OTHER

job_key_rule: >
  Prefer the Jobright job id when the source is Jobright
  (the last path segment of https://jobright.ai/jobs/info/<id>).
  Apply writes the Jobright source_url when it considers a card.
  Deduplicate again by normalized company + role + location
  when a Jobright id is missing. After the employer application is
  resolved, also deduplicate by employer requisition id, ATS job id, or
  canonical employer apply URL.

apply_url_confidence_values:
  - exact
  - strong
  - weak
  - none

capabilities:
  google_sheets:
    meaning: "Read and write Polar Jobs through the Google connector (Drive and Sheets tools)."
    literal_name_required: false
    sheet_title: "Polar Jobs"
    connector_aliases:
      - google
      - google_drive
      - google drive
      - drive
      - sheets
      - google sheets
    tool_evidence:
      - Find Drive file
      - Google Drive
      - Google Sheets
      - Sheets API
    not_sufficient:
      - browser
      - sheets.google.com
      - docs.google.com
    ask_to_add_connector: false

runtime_url:
  path: generated/polar/runtime/POLAR_RUNTIME.md
  raw_main: "https://raw.githubusercontent.com/JunyiZhou-Conny/job-search-2026-2027-starter/main/generated/polar/runtime/POLAR_RUNTIME.md"
  raw_branch_note: "Until main has this file, Polar may read the same path on the production branch."

workflow_url:
  dir: generated/polar/workflows
  raw_main_dir: "https://raw.githubusercontent.com/JunyiZhou-Conny/job-search-2026-2027-starter/main/generated/polar/workflows"
