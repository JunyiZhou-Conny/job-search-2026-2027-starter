# Deterministic resume ROUTE policy.
# Operational projection of knowledge/resume_philosophy.yaml family semantics
# onto discovery-card metadata. Not a copy of candidate lead_signals.
# BUILD owns philosophy, TeX, and registry activation. This file owns routing.

version: 1
updated: "2026-09-11"

production_families:
  - swe
  - ml_ai
  - ai_infra
  - health_ai

unresolved_family: REVIEW
confidence_values:
  - high
  - medium
  - review

input_fields:
  required:
    - role
  optional:
    - company
    - source
    - board_category
    - track
    - location
    - short_text
    - legacy_cluster

# Token-boundary matching. "ai" does not match inside "training".
# Punctuation becomes a break, so "AI/ML" and "(AI)" still match.

