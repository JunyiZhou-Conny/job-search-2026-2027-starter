# AI triage guide for discovery CSVs.
# Code does NOT apply these as regex hardcode — the agent reads this file + the CSV
# and writes generated/discovery_triage_YYYY-MM-DD.csv.
#
# Decisions: keep | later | skip
# Only user-confirmed keep rows should be ingested into data/applications.csv.

version: 3
updated: 2026-07-26

profile_anchors:
  # Dual dates — both real; do not collapse into one fake month.
  program_end_date: "2026-12-18"          # I-20 / SEVIS → OPT + earliest FT + default resume
  commencement_date: "2027-03"            # ceremony / some Harvard listings
  graduation_display_default: "December 2026 (program completion)"
  earliest_ft_start: "2027-01-18"         # planned from program end; confirm with HIO
  preferred_intern_term: "Summer 2027"
  skip_job_cycles: ["2026"]               # any 2026 intern/FT start term — not candidate grad year
  remote_ok: false
  preferred_work_mode: "in-person or hybrid"
  tracks: ["internship_if_eligible", "new_grad_2027_start"]  # co-primary
  role_clusters: ["cloud_swe", "data_ml", "health_ai"]
  emerging_interest: ["AI infra", "ML systems", "agents", "inference"]

data_policy:
  primary_input: "data/discovery/YYYY-MM-DD_all.csv"
  # Prefer board fields already in the CSV. Do not invent JD facts.
  # Optional: open a Jobright/company URL only when board text is ambiguous
  # AND the row would otherwise be keep/borderline — note if unread.
  do_not_fabricate: true
  sponsorship_unknown_is_not_skip: true

outputs:
  csv: "generated/discovery_triage_YYYY-MM-DD.csv"
  md: "generated/discovery_triage_YYYY-MM-DD.md"
  required_columns:
    - decision
    - company
    - role
    - url
    - source
    - track
    - work_model
    - location
    - posted_relative
    - fetched_at
    - suggested_lane
    - suggested_cluster
    - confidence
    - reason
    - evidence_basis   # board_fields | board_plus_url_skim | unknown
    - grad_display_hint  # program_end | dual_date | either | n/a
    - user_confirm     # leave blank for human

decision_meanings:
  keep: "Worth user review and likely ingest → applications; prepare Simplify apply."
  later: "Related but lower priority; do not ingest unless user promotes."
  skip: "Do not pursue now; explain which guide rule fired."

# Guides for the AI — judge each row; cite which rule id(s) in reason.
guide_rules:
  - id: remote
    severity: hard
    default_decision: skip
    guidance: >
      If work_model (or clear title/notes) indicates fully remote / remote-only,
      skip. Hybrid or on-site is fine. If work_model blank, do not assume remote;
      use later or keep based on other fit, and say evidence is incomplete.

  - id: non_target_role
    severity: hard
    default_decision: skip
    guidance: >
      Skip roles clearly outside SWE / data / ML / AI infra targets
      (e.g. data-center technician, pure QA-only, unrelated clinical non-tech,
      wholesale sales). Adjacent cyber/quant may be later, not automatic skip.

  - id: hard_gate
    severity: hard
    default_decision: skip
    guidance: >
      Skip only when board text clearly shows an incompatible hard gate:
      PhD-only, polygraph/TS-SCI when not viable, or a graduation/enrollment
      window that matches NEITHER real date:
        (A) program end 2026-12-18 / December 2026 completion, NOR
        (B) commencement / school-listed March 2027.
      Examples that should NOT auto-skip: "graduating Spring 2027",
      "December 2026 graduates", "currently pursuing a degree".
      Soft/vague windows → do not skip. Return-to-school after internship:
      evaluate against still being a student through program end and ceremony
      timing; if unclear, prefer later/keep over skip and note uncertainty.

  - id: start_date_conflict
    severity: hard
    default_decision: skip
    guidance: >
      Candidate target work window: internships starting Summer 2027 (preferred),
      and full-time on/after 2027-01-18. SKIP when the ROLE TERM / START is in 2026:
      - "Summer 2026", "Fall 2026", "Spring 2026", "Winter 2026" intern/co-op
      - "2026 Intern", "Intern 2026", "new grad 2026 start", start Jun–Dec 2026
      - Any clear employment start before 2027-01-18
      KEEP/review targets: Summer 2027 intern, Fall 2027 if relevant, 2027 FT.
      IMPORTANT — do NOT skip only because text mentions the candidate's
      graduation / program end "December 2026" / "2026-12-18". That is the
      person's date, not the job's start year. Skip on job-cycle/start-year 2026.

  - id: timing_expired
    severity: hard
    default_decision: skip
    guidance: >
      Same policy as start_date_conflict for intern cycles: any 2026 internship
      term is out of scope (not only "already over"). Prefer skip when the
      posting is a 2026 intern/new-grad cycle. Summer 2027+ is the default keep
      window for internships.

  - id: traditional_student_coop
    severity: soft
    default_decision: later_or_skip
    guidance: >
      Heavy "must be enrolled full-time undergrad / credit-hour co-op" framing
      with weak SWE fit → skip or later. Do not skip strong SWE/ML internships
      merely because they say "currently pursuing a degree" — candidate remains
      in program through December 2026 program end (commencement March 2027).

  - id: intern_ok
    severity: policy
    default_decision: allow_keep
    guidance: >
      Internships remain co-primary with new-grad, but only for 2027 cycles
      (esp. Summer 2027). 2026 internship terms are NOT ok — use
      start_date_conflict / timing_expired. Prefer keep/later when graduation
      wording is uncertain but the term is clearly 2027. Use grad_display_hint:
      program_end (default), dual_date (Spring/March wording), or either.

  - id: dual_grad_dates
    severity: policy
    default_decision: allow_keep
    guidance: >
      Program end (I-20) Dec 2026 and commencement March 2027 are both real.
      Do not hard-skip only because the posting says March/Spring 2027, and do
      not hard-skip only because it says December 2026. Set grad_display_hint
      so the user knows which resume line to use at apply time.

  - id: fit_priority
    severity: soft
    default_decision: keep_or_later
    guidance: >
      Prefer keep for cloud_swe / data_ml / AI infra / agents / strong new-grad SWE.
      Use later for weak adjacent (generic front-end, QA automation, light analytics).
      suggested_lane: core | broad | practice.

process:
  - Read knowledge/discovery_triage_rules.yaml and config/profile.yaml.
  - Read data/discovery/YYYY-MM-DD_all.csv (every row).
  - For each row, choose keep|later|skip using guide_rules; write reason with rule id(s).
  - Set evidence_basis honestly (usually board_fields).
  - Set grad_display_hint: program_end | dual_date | either | n/a.
  - Write CSV + short MD summary with counts.
  - Do NOT write applications.csv until user confirms keep rows.
