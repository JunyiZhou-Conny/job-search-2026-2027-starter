guidance:
  - id: harvard_mcs_one_page
    source: "https://careerservices.fas.harvard.edu/resources/create-a-strong-resume/"
    class: authoritative
    keep: "One page. Fact-based. Tailor to the skills the employer would value. Express, do not impress."
    drop: "Harvard MCS also pushes leadership/activities sections that this candidate does not need on a tech one-pager."
  - id: harvard_mcs_ai_not_author
    source: "https://careerservices.fas.harvard.edu/resources/create-a-strong-resume/"
    class: authoritative
    keep: "Generative AI may edit. It must not be the primary author."
  - id: phd_to_industry_selection
    source: "Common PhD-to-industry advice (TailorCV, RenderCV, Awesome-PhD-CV guidelines)"
    class: industry_heuristic
    keep: "A resume is an argument, not a complete record. Cut work that does not support the argument."
    drop: "Do not invent business-impact percentages when the lab never measured them."
  - id: grounded_export_gate
    source: "Resume-talos / ResumeProof / CareerProof public designs"
    class: industry_heuristic
    keep: "A groundedness gate that blocks export when a claim has no fact id."
    drop: "ATS vendor scores and dual-model QC theater without a measured basis."
  - id: keyword_stuffing
    source: "Common ATS blog advice"
    class: unsupported_convention
    keep: null
    drop: "Do not add tools the candidate has not used so a parser lights up."
  - id: outcome_learning
    source: "data/resume_versions.csv in this repo"
    class: empirical_later
    keep: "Record parent, hypothesis, strategy, and funnel counts. Do not claim a model while counts are near zero."

max_projects: 4
max_bullets_per_project: 3

global_forbidden_tokens:
  - pinecone
  - kubernetes
  - k8s
