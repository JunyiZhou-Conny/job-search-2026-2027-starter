# Regular vs prioritized apply weight.
# Orthogonal to pursuit_lane (core/broad/practice) and letter priority (A/B/C/D).
# Labels are suggestions until Junyi confirms (docs/BOUNDARIES.md).
# Do not Submit, send LinkedIn, or send 1point3acres/email from this file.

last_updated: "2026-08-24"
source: "Junyi Charta FDE notes plus Lila / Hayden reviews"

# Two chunks
application_weight:
  regular:
    meaning: "Mass autofill is fine. Cluster resume. Short, prompt-faithful free response."
  prioritized:
    meaning: >
      Extra judgment. Tailor resume toward the JD using only evidence-bank
      facts. Free-response gets a real answer to the prompt, not a project
      dump. Full form prep, then stop before Submit and hand Junyi a
      review packet (docs/policy/SUBMIT_ROLLOUT.md, 2026-09-03). Do not
      wait for a referral / insider-page check before preparing the
      packet. Junyi 2026-08-24: those pages are rare; the public pool is
      closer to FIFO, so waiting costs more than it saves.
    subfields:
      - id: gtc_2026
        meaning: "Company appears on NVIDIA GTC 2026 sponsors/exhibitors."
        source: "knowledge/market_signals/gtc2026_sponsors_exhibitors.md"
        official_page: "https://www.nvidia.com/gtc/sponsors/"
        note: >
          Being on the list is a signal they showed up for AI, not a claim
          about spend. Elite/Diamond/Gold is a stronger signal than a
          235-company Exhibitor row. Do not invent a tier.
      - id: startup
        meaning: "Vibrant / engaging / can be pushy. Early or scaling company."
        source: "knowledge/company_lists.yaml startup_or_scaleup is a hint only."
        note: "Hint, not a confirmation. Junyi decides."
      - id: prestige
        meaning: "Top big tech, biomedical, or research institute Junyi values."
        source: "knowledge/company_lists.yaml big_tech / biotech is a hint only."
        note: "Hint, not a confirmation. Junyi decides."
      - id: fde
        meaning: >
          Forward-deployed engineer / Forward Deployed AI. Palantir-coined
          on-site last-mile role. See knowledge/role_families.yaml.
        note: >
          Junyi 2026-08-24: mark these. Suitable. Charta is the type example
          in a biomedical AI company. Confirm the row; do not skip them.

