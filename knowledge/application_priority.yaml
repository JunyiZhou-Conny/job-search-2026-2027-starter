do_not_conflate:
  - pursuit_lane is effort mix (core/broad/practice), not this filter
  - letter priority A/B/C/D is the old score, not regular/prioritized
  - company_lists.yaml class is a sort hint, not a confirmed weight

apply_behavior:
  regular:
    - Copilot + standing form_strategy
    - Cluster resume
    - Free response answers the prompt; no project dump
    - Cover letter stays empty unless Junyi asks
  prioritized:
    - Same standing yes/no rules (relocate, sponsorship, salary floor)
    - More time on Why-us / JD-specific writing
    - Visually confirm phone, resume attachment, sponsorship — do not trust Copilot "Completed"
    - Default next_action: review packet for Junyi when the form is ready; do not wait for a referral URL
    - Draft coffee-chat / LinkedIn only; never send without Junyi confirm
    - 1point3acres is a noisy research source, not an auto-apply channel

referral_risk:
  decided: "2026-08-23"
  revised: "2026-08-24"
  rule: >
    Do not hold a prioritized row for a referral or insider-page check.
    Prepare the form and the review packet; Junyi decides Submit
    (docs/policy/SUBMIT_ROLLOUT.md). If a named employee later has a
    real insider URL, record it; do not rewind a landed public apply.
  why: >
    The 2026-08-23 hold assumed a public apply can close a later
    referral (Ashby "candidate already exists"; some Greenhouse
    workflows). Junyi 2026-08-24: those insider pages are rare, and
    waiting to verify one loses FIFO place in the employer queue.
    The conflict is real but not worth the delay.
  do:
    - Review packet when the form and Why-us are ready
    - Record referral_status on the ledger only after a real outcome
  do_not:
    - Hold a ready form while hunting 1point3acres / LinkedIn for 内推
    - Open a sibling job to dodge a referral
    - Message employees or 1point3acres posters without confirm
    - Treat this as permission to invent Why-us or skip leftover_typing_one_pass

