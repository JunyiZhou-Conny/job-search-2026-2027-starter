do_not_conflate:
  - pursuit_lane is effort mix (core/broad/practice), not this filter
  - letter priority A/B/C/D is the old score, not regular/prioritized
  - company_lists.yaml class is a sort hint, not a confirmed weight

apply_behavior:
  regular:
    - Copilot + standing form_strategy
    - Cluster resume
    - Free response answers the prompt; no project dump
    - Cover letter stays empty unless Junyi asks
  prioritized:
    - Same standing yes/no rules (relocate, sponsorship, salary floor)
    - More time on Why-us / JD-specific writing
    - Visually confirm phone, resume attachment, sponsorship — do not trust Copilot "Completed"
    - Default next_action: check referral path; do not public-Submit
    - Draft coffee-chat / LinkedIn only; never send without Junyi confirm
    - 1point3acres is a noisy research source, not an auto-apply channel

referral_risk:
  decided: "2026-08-23"
  rule: >
    For prioritized companies, assume a public apply can close the
    clean referral path until Junyi or a named employee says otherwise.
  why: >
    Junyi: some shops have an insider / referral apply page; applying
    on the public ATS first can disqualify a later referred apply.
    Ashby docs: some configs block a referral if the candidate already
    exists. Greenhouse often attaches a later referral to the existing
    profile — company-specific, not guaranteed.
  do:
    - Hold public Submit on prioritized rows
    - Ask whether a referral / insider URL exists before clicking Apply
    - Record referral_status on the ledger only after a real outcome
  do_not:
    - Submit the public form "just in case"
    - Open a sibling job to dodge a referral hold
    - Message employees or 1point3acres posters without confirm

