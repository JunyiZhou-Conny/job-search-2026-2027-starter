- id: airway.fullstack_deploy
  claim: HIPAA-conscious Flask/React/Auth0/MongoDB app deployed on AWS Elastic Beanstalk
    and CloudFront
  evidence:
  - software_engineering_evidence
  - measurable_results
  verification_status: verified
  confidence: high
  resume_eligible: true
  interview_defensibility: strong
  signals:
  - architecture
  - apis
  - deployment
  - ownership
  relevant_role_families:
  - swe
  - ml_ai
  - data
  allowed_wording:
    swe: Architected a HIPAA-conscious full-stack platform (Python/Flask REST API,
      React, MongoDB, Auth0) and deployed it on AWS Elastic Beanstalk and CloudFront.
    ml_ai: Shipped the clinical simulation as a Flask REST service with React and
      Auth0, then deployed the stack on AWS Elastic Beanstalk and CloudFront.
    data: Persisted application state in MongoDB and delivered the HIPAA-conscious
      demo through AWS Elastic Beanstalk and CloudFront.
    health_ai: Shipped a HIPAA-conscious clinical simulation platform used with a
      clinician feedback loop.
  forbidden_claims:
  - Pinecone
  - Kubernetes
  project_id: airway_chatbot
  evidence_fields:
