# Last gate before Submit. Simplify Copilot often skips these.
consent_checkboxes:
  decided: "2026-08-23"
  rule: >
    Click required privacy / application-statement / "I agree" squares
    every time. Do not click Submit after them unless Junyi named that
    row. Computer-use (or a later Playwright helper on the SAME Chrome
    profile) does this. Do not invent a new browser.
  do_not_click:
    - Submit
    - Apply (final)
    - MyGreenhouse login
    - EEO boxes the agent did not already decide
  how:
    - "Preferred now: computer-use clicks the visible required checkbox."
    - "Later: a small script that finds required unchecked boxes near Submit and checks them, then stops."
    - "Same Chrome profile as Copilot. Two browsers would miss the filled form."

# Closed / vanished postings (Together AI 2026-08-23; will happen often)
closed_posting:
  decided: "2026-08-23"
  signals:
    - "The job you are looking for is no longer open"
    - "Greenhouse ?error=true board dump / Current openings list"
    - "404 / posting removed"
  do:
    - Close that tab. Do not stay on the employer's current-openings list.
    - Do not open a sibling job from that list.
    - Append data/job_decisions.csv with decision=closed (not pass).
    - Append data/activity_log.csv event_type=posting_closed. Do not invent a job_id.
    - Next queued URL.
  reason: >
    High-volume roles often close within minutes. The board list is not
    an application. Tracking closed URLs stops them from resurfacing.

# HOW the clicker touches the form — not new identity facts.
# Junyi leftover rules after Advanced Space redo. Identity answers stay
# in always: (disability_status) and work_authorization.yaml.
clicker_cheap_cuts:
  decided: "2026-08-25"
  source: "Junyi leftover rules after Advanced Space redo"
  what: >
    Clicker mechanics only. Copilot = Simplify Copilot sidebar, not
    Cursor and not the ATS native Autofill button.
  copilot:
    meaning: "Simplify Copilot sidebar only."
    do:
      - Click "Start Application" or "Autofill This Page" once.
      - Wait until it finishes.
    if_missing: >
      Stop and report harness_not_ready only if neither Copilot CTA is
      present. Ashby shows "Start Application" first; that is not a
      missing harness.
  never_click:
    greenhouse_native_autofill: >
      Never click Greenhouse's own "Autofill my application" /
      quick-apply. That is a login wall.
    ashby_native_autofill: >
      Never click Ashby native "Autofill from resume" / Upload file.
    mygreenhouse_login: "Never click MyGreenhouse login. Never create an account."
    run_autofill_again: "Never Run Autofill Again."
    generate_with_ai: "Never click Generate with AI."
  do_not_run_autofill_again: true
  after_copilot:
    do: >
      Only touch Simplify sidebar leftovers marked "need review"
      (plus standing widgets that are actually on screen).
    do_not: >
      Do not walk the whole leftover list looking for missing widgets.
  do_not_audit_the_page:
    - Do not scroll the form as a UI test.
    - Do not walk identity fields to prove Copilot worked.
    - Do not hunt gender / race / veteran just to check them.
  eeo:
    disability_is_not_leave_alone: true
    disability: >
      Disability is not in the leave-alone EEO set. Always No / I do
      not have a disability. Answer lives in always.disability_status;
      do not duplicate it here.
    leave_alone_as_copilot_set:
      - gender
      - race
      - veteran
  identity: >
    Do not type name, email, phone, or resume by hand. Copilot does
    identity.
  tabs: "One ATS tab. Do not open a sibling job from a board list."
  submit: >
    Stop before Submit unless Junyi names that URL and writes Submit
    in that turn.
  parked:
    - why-us
    - cover letter
  do_not_invent:
    - SAT/ACT
    - citizenship
    - stories
    - project URLs
  reason: >
    Cheap cuts after the Advanced Space redo. The clicker fills
    leftovers; it does not page-audit, native-Autofill, or invent.
