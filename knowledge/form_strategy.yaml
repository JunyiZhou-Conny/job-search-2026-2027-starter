    flip it to No. Leftover until Junyi or HIO wording is confirmed.

# Country-named sponsorship is not the US Yes-rule (Perplexity 2026-08-23)
country_specific_sponsorship:
  decided: "2026-08-23"
  when: >
    Sponsorship question names other countries only (e.g. United
    Kingdom, Germany, or Serbia) and does not ask about the United
    States.
  do_not_use: "US visa_sponsorship widget rule"
  reason: >
    Perplexity Search ML intern asked UK/Germany/Serbia. Copilot No.
    That is a different question from the US visa-sponsorship widget.
    Do not auto-map it.

# Leftover typing is one paste (Junyi 2026-08-24, Charta)
leftover_typing_one_pass:
  decided: "2026-08-24"
  when: "Junyi already accepted a draft and said type it / he will Submit"
  parent_writes_the_clicker_prompt: true
  prompt_template: "docs/automation/COMPUTER_USE_PROMPT.md"
  do:
    - One computer-use call.
    - Copy the template. Fill only tab, URL, field, and accepted text.
    - Find the tab. Click the box. Select all. Paste once.
    - One screenshot. Stop.
  do_not:
    - Type the essay character by character when paste works
    - Add verify / Ctrl+F / Ctrl+End / phrase-hunt steps to the Task prompt
    - Fight autosuggest with Escape loops or click-away cleanup
    - Resume computer-use to scroll a cropped textarea
    - Start a second or third pass to check a blank line or a typo
    - Start a screen recording unless Junyi asked for a demo
    - Re-read many screenshots as if this were a UI test
  reason: >
    The clicker only sees pixels. Asking it to prove the paste makes it
    a slow macro recorder. Junyi can see the tab. He is about to Submit.

# Other computer-use token sinks (2026-08-24 isolation + 3-pack)
# leftover_typing_one_pass is only the Why-us paste case. These are
# separate. Some have a rule. Some do not have a helper yet.
computer_use_token_sinks:
  decided: "2026-08-24"
  documented_with_a_rule:
    leftover_verify_loops:
      what: "Parent resumes computer-use to Ctrl+F / scroll / prove a paste"
      solution: "leftover_typing_one_pass + docs/automation/COMPUTER_USE_PROMPT.md"
    autofill_again:
      what: "Run Autofill Again after corrections"
      solution: "do_not_run_autofill_again"
    nested_task_cloud_child:
      what: "Task environment=cloud child has no computerUse"
      solution: "Dashboard Cloud Agent. First isolation child was not_run."
    generate_with_ai:
      what: "Simplify Generate with AI on leftover essays"
      solution: "Never click. written_responses.never_click"
  documented_no_helper_yet:
    vision_full_apply:
      what: >
        Even a clean Autofill+Submit pass is expensive. The clicker
        screenshots after almost every move (20–30 stills per short
        Ashby form). There is no DOM / Playwright fill this week.
      see: "docs/automation/COMPUTER_USE_PROMPT.md Later (not this week)"
    parent_screenshot_audit:
      what: >
        Parent re-reads many /tmp/computer-use/*.webp after the clicker
        already reported Success. Needed for Submit-truth experiments.
        Waste for leftover paste. leftover_typing_one_pass already
        says do not re-read many screenshots as a UI test.
    screen_record_plus_review:
      what: >
        Cloud walkthrough rules want a demo video. leftover rule says
        do not record unless Junyi asked. videoReview also failed on a
        15MB recording. Do not start RecordScreen for leftover paste.
        For Submit experiments, one short recording is enough; do not
        also spawn videoReview on a huge file.

# Do not re-run Copilot after human / computer-use corrections
do_not_run_autofill_again:
  decided: "2026-08-23"
  rule: >
    After computer-use corrects sponsorship / U.S. Person / relocate,
    do not click Simplify "Run Autofill Again". A later Autofill on
    Lila cleared Yes dropdowns to Select… and flipped Baseten
    sponsorship back to No.
  reason: "Corrections are not sticky across a second Autofill."

# Ashby submit-time spam wall (Charta 2026-08-24)
ashby_spam_submit_block:
  decided: "2026-08-24"
  page_copy: "We couldn't submit your application. Your application submission was flagged as possible spam."
  meaning: "Submit did not land. Not a Why-us length limit."
  do:
    - Stop retrying on the parent Cloud Chrome that already hit the wall.
    - Junyi retries from his own machine, no VPN, Copilot paused.
    - Prefer home or mobile data. Wait a few minutes.
  do_not:
    - Keep clicking Submit on the already-blocked VM
    - Invent a fingerprint or captcha bypass
    - Treat this as Ashby's recruiter-only fraud panel (that one is after a successful submit)
  exception_one_fresh_vm: "docs/experiments/2026-08-24_ashby_submit_isolation.md"
  see: "docs/apply/OBSTACLES.md"

