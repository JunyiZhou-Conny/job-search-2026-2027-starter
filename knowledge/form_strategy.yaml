# Workday / ATS account walls (CVS Health 2026-08-23)
account_creation_wall:
  decided: "2026-08-23"
  do:
    - Close the tab.
    - Do not create Workday / Greenhouse / MyGreenhouse accounts.
    - Do not pick a sibling requisition from the same board.
    - Log autofill_blocked or similar in data/activity_log.csv.
  reason: "Junyi: do not create accounts during these supervised tests."

# Closed / vanished postings (Together AI 2026-08-23; will happen often)
closed_posting:
  decided: "2026-08-23"
  signals:
    - "The job you are looking for is no longer open"
    - "Greenhouse ?error=true board dump / Current openings list"
    - "404 / posting removed"
  do:
    - Close that tab. Do not stay on the employer's current-openings list.
    - Do not open a sibling job from that list.
    - Append data/job_decisions.csv with decision=closed (not pass).
    - Append data/activity_log.csv event_type=posting_closed. Do not invent a job_id.
    - Next queued URL.
  reason: >
    High-volume roles often close within minutes. The board list is not
    an application. Tracking closed URLs stops them from resurfacing.
