    bullets: 3–4 concise examples with quantitative metrics already in
    the evidence bank. Do not invent metrics, employers, or outcomes.
  if_evidence_missing: "Leave for Junyi leftover pile. Do not fabricate."
  archive: >
    Every draft goes in docs/apply/written_answers/ (one file per
    company + role + date). Reusable ideology lives in
    knowledge/written_response_bank.yaml. This is the interview recall
    file — what we wrote, not a claim that it was submitted.
  ideology_for_week_or_meaning_questions: "knowledge/written_response_bank.yaml"

