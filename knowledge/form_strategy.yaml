# Copilot = Simplify Copilot (Chrome extension). It will not read this file.
# Cursor / computer-use must apply these after Copilot, or Junyi types them.
# Submit is governed by docs/policy/SUBMIT_ROLLOUT.md.

last_updated: "2026-08-27"
source: "Junyi Scale / Notion / Perplexity inspect plus Hayden / Lila / Traba rules; Junyi 2026-08-25 work-auth / GPA / website / discipline; Junyi leftover rules after Advanced Space redo 2026-08-25"

always:
  employed_by_this_company_before:
    decided: "2026-08-23"
    form_answer: "No"
    when: "Have you been employed by [this company] in the past?"
    reason: "Junyi: first intern / first job. Always No for prior-employer questions."

  open_to_relocating:
    decided: "2026-08-23"
    form_answer: "Yes"
    when: "Are you open to relocating?"
    reason: "Junyi: any US city; will move. Always Yes."

  h1b_named_question_only:
    see: "knowledge/work_authorization.yaml form_strategy.h1b_named_question_only"
    form_answer: "No"

  visa_sponsorship:
    status: owner_confirmed
    confirmed_by: "Junyi, written, 2026-09-03 (Twitch review)"
    form_answer: "No"
    accept_also: ["No, I do not need sponsorship", "None"]
    see: "knowledge/work_authorization.yaml form_strategy.visa_sponsorship"
    when: >
      Will you now or in the future require visa sponsorship? / require
      sponsorship? / visa sponsorship yes-no / None. Prefer the exact No
      wording if the widget is a radio. If None is an option, pick None.
      If it is free text, type the sentence.
    supersedes: "2026-08-23 broad-Yes flip (Lila/Hayden/Relativity/Scale)"
    before_any_submit: >
      Re-read the sponsorship widget. If it is Yes, stop. Junyi: this
      answer is crucial for not getting filtered out.
    fact_unchanged: "future_sponsorship_required remains true"
    reason: >
      Junyi Hayden review 2026-08-24. Computer-use had flipped Hayden
      from Copilot No to Yes under the old rule. Form still shows Yes.
      Not re-clicked. Later pass must set No.

  citizenship_country:
    decided: "2026-09-03"
    form_answer: "China"
    when: "Country of citizenship / nationality. Also the export-control country widget."
    see: "knowledge/work_authorization.yaml form_strategy.citizenship_country"
    copilot_note: "Copilot set United States on Twitch 2026-09-03. Always re-read this widget after autofill."

  permanent_resident_elsewhere:
    decided: "2026-09-03"
    form_answer: "No"
    when: "Since obtaining your most recent citizenship, did you become a permanent resident elsewhere?"

  eligible_to_begin_employment_immediately:
    decided: "2026-09-03"
    form_answer: "Yes"
    when: "If offered employment, would you be legally eligible to begin employment immediately?"

  eeo_self_identification:
    decided: "2026-09-03"
    rule: "Preserve the values Simplify Copilot fills from Junyi's profile. Do not clear them. Do not change them."
    junyi_confirmed_values:
      gender: "Male"
      hispanic_latino: "No"
      race: "Asian"
      veteran_status: "I am not a protected veteran"
      disability: "No, I do not have a disability and have not had one in the past"
    note: "Supersedes the 2026-08-22 eeo_touched block rule for these five categories. A different value from Copilot is still a stop-the-line item."

  years_of_relevant_experience:
    decided: "2026-08-24"
    form_answer: "2"
    when: >
      How many years of relevant / work / professional experience do
      you have?
    reason: "Junyi Hayden 2026-08-24: standard answer 2 for this type."

  automated_script_or_spoofing:
    decided: "2026-08-24"
    form_answer: "No"
    when: "Are you applying via an automated script or spoofing?"
    reason: >
      Junyi Hayden 2026-08-24: always No. Sidebar may mark it complete
      while neither radio is selected — look at the widget.

  prior_internship_or_coop_in_general:
    decided: "2026-08-23"
    form_answer: "Yes"
    when: "Do you have prior internship or co-op experience?"
    reason: "Junyi: always Yes when the company is not named."

  prior_internship_or_coop_at_this_company:
    decided: "2026-08-23"
    form_answer: "No"
    when: >
      Internship/co-op at a named company, or at this employer / an
      affiliate of this employer.
    reason: "Junyi: always No when they name the company."

  graduation_year_on_forms:
    decided: "2026-08-23"
    form_answer: "2027"
    when: "What year will you graduate?"
    reason: >
      Junyi: put 2027. Commencement is March 2027. Program end is still
      2026-12-18 in work_authorization.yaml — do not delete that fact.

  graduation_date_on_forms:
    decided: "2026-08-24"
    form_answer: "2026-12-18"
    when: >
      Graduation date / expected graduation as a full date (not year-only).
    reason: >
      Junyi Notion 2026-08-24: the date is December 18. That is program
      end / I-20, not commencement. Year-only widgets stay 2027.

  on_site_or_work_on_site:
    decided: "2026-08-23"
    form_answer: "Yes"
    when: "I understand this position requires me to work on-site / on site."
    speech_to_text_note: "Junyi said 'work on science'; treated as on-site."
    reason: "Junyi: always Yes; No would screen out."

  committed_schedule_or_anchor_days:
    decided: "2026-08-24"
    form_answer: "Yes"
    when: >
      Anchor Days / committed to in-office Mon Tue Thu / office N days
      per week / are you committed to this schedule.
    reason: >
      Junyi Notion 2026-08-24: for these, the obvious answer is Yes.

  location_interest_pick_one:
    decided: "2026-08-24"
    form_answer: "pick_one_us_option_that_unblocks"
    when: "Indicate all locations of interest / which office / area"
    reason: >
      Junyi Notion 2026-08-24: pick one at random. Do not leave it empty
      if that blocks Submit. Prefer a US city on the list. Do not invent
      a city that is not an option.

  visa_type_named:
    decided: "2026-08-24"
    form_answer: "F-1"
    accept_also: ["F1", "F-1 Student"]
    when: "Current visa type / what is your visa status / select your visa"
    reason: >
      Junyi Notion 2026-08-24: when they ask for the type, put F-1.
      Future-sponsorship widgets stay No / None.

  prior_internship_count:
    decided: "2026-08-24"
    form_answer: "2"
    when: "How many prior internships / how many internships have you had?"
    reason: "Junyi Notion 2026-08-24: always 2."

  engineering_role_interest:
    decided: "2026-08-24"
    prefer_in_order: ["backend", "platform", "cloud", "infrastructure", "ML", "AI"]
    when: "What type of engineering role are you interested in?"
    reason: >
      Junyi Notion 2026-08-24: pick the closest fit. If none match,
      pick any option that does not block Submit.

  how_did_you_hear:
    decided: "2026-08-23"
    revised: "2026-08-24"
    form_answer: "LinkedIn"
    prefer_exact: "LinkedIn Job Board (if that checkbox/option exists)"
    fallback_ok: "Any listed option that unblocks Submit"
    when: "How did you hear about us / this job / this company?"
    reason: >
      Junyi Notion 2026-08-24: trivial. Prefer LinkedIn. If LinkedIn is
      missing or hard, pick whatever works so the form can Submit.
    if_copilot_skips: >
      Tick LinkedIn Job Board or the closest LinkedIn option. If that
      option is not there, tick any listed source. Then stop.

  ideal_start_date:
    decided: "2026-08-23"
    when_jd_names_a_term: >
      Use the posting's term (e.g. Fall 2027, Spring 2027, Summer 2027).
      Skip 2026 intern cycles (already a discovery hard skip).
    when_jd_has_no_term: "2027-05-18"
    reason: "Junyi: rare no-term case → a date in May; he said May 18."

  salary_or_expected_compensation:
    decided: "2026-08-23"
    when: "Salary expectations / expected pay / compensation (numeric or free-text)"
    if_page_lists_a_range: >
      Type the listed minimum only (Traba 2026-08-23: page showed
      $140K–$200K → type 140000). Junyi: asking above the floor is how
      a company rejects you; do not invent a higher number.
    if_page_has_no_number: "90000"
    reason: >
      Junyi 2026-08-23 on Traba. 90k is the no-information default, not
      a target when the posting already prints a range.

  gpa:
    decided: "2026-08-25"
    harvard_masters: "4.0"
    emory_undergrad: "3.925"
    if_only_one_gpa_box: "4.0"
    when: "GPA / undergraduate GPA / graduate GPA / current GPA"
    do_not: "Invent any other GPA, SAT, ACT, or a third-school GPA."
    reason: >
      Junyi 2026-08-25: Harvard 4.0 is the current master's GPA and the
      single-box default. Emory 3.925 is undergrad. These are on his
      resume. Real numbers. Not invented.

  personal_website:
    decided: "2026-08-25"
    form_answer: "https://connyzhou.com"
    when: "Personal website / portfolio / website URL"
    supersedes: "later_not_this_run.personal_website empty-until-live-URL"
    reason: >
      Junyi 2026-08-25: he is registering this site and wants it on
      applications. Use this URL on forms. Cover letter stays parked.

  education_discipline_or_field_of_study:
    decided: "2026-08-25"
    prefer_in_order: ["Data Science", "Computer Science", "Mathematics"]
    if_none_exist: "Other"
    when: "Education discipline / field of study / major / area of study"
    if_copilot_picks_other_on_masters: >
      Flip off Other. Prefer Data Science, then Computer Science,
      then Mathematics.
    reason: >
      Junyi 2026-08-25: Copilot often wrongly picks Other on the
      master's. Prefer the listed order. Other only if none of those
      options exist.

  disability_status:
    decided: "2026-08-25"
    form_answer: "No"
    accept_also:
      - "I do not have a disability"
      - "No, I don't have a disability"
    never_leave: "Select"
    when: >
      Disability status / do you have a disability / I do not have a
      disability.
    eeo_note: >
      Disability is not in the leave-alone EEO set. Other EEO (gender,
      race, veteran) can stay as Copilot set them.
    reason: >
      Junyi 2026-08-25. Always No / I do not have a disability. Never
      leave Select. Other EEO can stay.

# One past-project story (Perplexity 2026-08-24). Do not dump three projects.
one_project_story:
  decided: "2026-08-24"
  when: "Tell us about a past project you have worked on / a project you are proud of"
  rule: >
    One story. Match the company's mission (AI product / search vs
    biomedical vs general SWE). Do not paste education plus three
    projects. Stories are not written yet — see
    knowledge/project_stories.yaml. Until Junyi fills a type, leave
    the box for him or skip Submit on that row.
  do_not:
    - Recite Cannon + chatbot + course work in one answer
    - Invent a project that matches the company
    - Brainstorm stories in chat unless Junyi asks

# External-artifact / non-standard apply questions
nonstandard_apply_hold:
  decided: "2026-08-24"
  when: >
    The form needs an external website, product exercise, shared URL,
    or other artifact that is not in the profile or evidence bank
    (example: Perplexity "teach in a thread" / "enlist Perplexity as
    champion" shared URL).
  do:
    - Do not Submit
    - Do not invent the URL or artifact
    - Mark the job nonstandard_apply_hold
    - Surface it in the daily KEEP digest under Non-standard apply holds
  do_not:
    - Treat Why-us / past-project / how-heard as non-standard
  see: "knowledge/nonstandard_apply_holds.yaml"

written_responses:
  decided: "2026-08-23"
  revised: "2026-08-24 — Charta DL spelling is role-specific; Lila hedges stay"
  never_click: "Simplify 'Generate with AI' (paid / subscribe). Do not click it."
  who_writes: "Cursor / this agent, after Copilot"
  answer_the_prompt:
    rule: >
      Answer the question that is on the page, in the order it is asked.
      "Why Lila, why this role, and why at this moment?" means those
      three things — not a resume, not Cannon 338, not the ideology pack
      unless that question asked for them.
    tone: >
      Ardent, genuine, truthful. First intern / student voice is fine.
      Honest hedges about missing domain experience are OK (Lila).
      Do not invent jobs. Do not dump a DL tour onto a non-ML Why-us.
    do_not:
      - Paste education + three projects into every Why-us
      - Recite program_end / commencement dates unless the prompt asks
      - Force the Traba week-structure ideology into a company-why box
      - Invent instrument, domain, or insider experience
      - Name CellOT, VLM, CV, airway chatbot, or other resume-internal labels
      - Write hedge lines such as "I do not outsource the goal"
      - Use em dashes or hyphen asides in form text (looks AI-written)
      - Spell out computer vision, language models, and transformers unless
        the role or prompt is ML / FDE / perception
    metrics_when: >
      Only when the prompt asks for examples, exceptional ability, or
      evidence. Then 1–2 evidence-bank facts, not a tour of the bank.
  if_evidence_missing: "Leave for Junyi leftover pile. Do not fabricate."
  archive: >
    Every draft goes in docs/apply/written_answers/ (one file per
    company + role + date). If Junyi rejects a draft, keep the typed
    text as historical and add a revised draft in the same file.
  ideology_for_week_or_meaning_questions: "knowledge/written_response_bank.yaml"
  prioritized_companies: >
    Same truth rules, more care. Read the JD. Say why this company and
    this role. Do not make it longer by dumping projects. See
    knowledge/application_priority.yaml.
  why_company_direction_2026-08-24: >
    Junyi Hayden + Charta: Why-us is not a one-liner and not a project
    dump. If the prompt has two parts (why this company, why now / why
    this role), answer both. Start from what they do, the mission, and
    the culture, then integrate Junyi's health-data / research /
    engineering philosophy. Use only facts he stated or that sit in
    the evidence bank. Do not invent domain ownership. Do not claim a
    CS degree (Emory is AMS + informatics minor). Do not claim FDE
    customer-on-site work already done. Charta / ML-FDE only: HR may
    read it first. Show frontend/backend and spell out computer vision,
    language models, transformers. Flask, React, Auth0, RAG, Cursor,
    Claude, Codex are fine. Do not name CellOT, VLM, CV, or the Emory
    airway project. Do not write "I do not outsource the goal." Do not
    copy that DL tour onto instrument, SWE, or other non-ML Why-us
    (Lila revised archive is the pattern). No em dashes or hyphen
    asides on the form. Write like a person. Example: Charta archive
    v2 (hyphen pass).

