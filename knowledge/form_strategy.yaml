# Form-answer rules Junyi confirmed. Not a second ATS.
# Copilot = Simplify Copilot (Chrome extension). It will not read this file.
# Cursor / computer-use must apply these after Copilot, or Junyi types them.
# Do not Submit unless Junyi explicitly says so for a named row.

last_updated: "2026-08-23"
source: "Junyi Lila evening review plus earlier 10-tab / Traba rules"

always:
  employed_by_this_company_before:
    decided: "2026-08-23"
    form_answer: "No"
    when: "Have you been employed by [this company] in the past?"
    reason: "Junyi: first intern / first job. Always No for prior-employer questions."

  open_to_relocating:
    decided: "2026-08-23"
    form_answer: "Yes"
    when: "Are you open to relocating?"
    reason: "Junyi: any US city; will move. Always Yes."

  h1b_named_question_only:
    see: "knowledge/work_authorization.yaml form_strategy.h1b_named_question_only"
    form_answer: "No"

  prior_internship_or_coop_in_general:
    decided: "2026-08-23"
    form_answer: "Yes"
    when: "Do you have prior internship or co-op experience?"
    reason: "Junyi: always Yes when the company is not named."

  prior_internship_or_coop_at_this_company:
    decided: "2026-08-23"
    form_answer: "No"
    when: >
      Internship/co-op at a named company, or at this employer / an
      affiliate of this employer.
    reason: "Junyi: always No when they name the company."

  graduation_year_on_forms:
    decided: "2026-08-23"
    form_answer: "2027"
    when: "What year will you graduate?"
    reason: >
      Junyi: put 2027. Commencement is March 2027. Program end is still
      2026-12-18 in work_authorization.yaml — do not delete that fact.

  on_site_or_work_on_site:
    decided: "2026-08-23"
    form_answer: "Yes"
    when: "I understand this position requires me to work on-site / on site."
    speech_to_text_note: "Junyi said 'work on science'; treated as on-site."
    reason: "Junyi: always Yes; No would screen out."

  how_did_you_hear:
    decided: "2026-08-23"
    form_answer: "LinkedIn"
    prefer_exact: "LinkedIn Job Board (if that checkbox/option exists)"
    fallback_ok: "LinkedIn / LinkedIn feed / any normal public LinkedIn source"
    when: "How did you hear about us / this job / this company?"
    reason: >
      Junyi: LinkedIn is fine; pick a normal public source, not random junk.
      Copilot often leaves this empty (Traba 2026-08-23). Computer-use on
      the same Chrome must click it every time. Do not leave it for later.
    if_copilot_skips: >
      Spawn computer-use (same Chrome profile as Copilot). Tick LinkedIn
      Job Board or the closest LinkedIn option. Then stop. Do not Submit.

  ideal_start_date:
    decided: "2026-08-23"
    when_jd_names_a_term: >
      Use the posting's term (e.g. Fall 2027, Spring 2027, Summer 2027).
      Skip 2026 intern cycles (already a discovery hard skip).
    when_jd_has_no_term: "2027-05-18"
    reason: "Junyi: rare no-term case → a date in May; he said May 18."

  salary_or_expected_compensation:
    decided: "2026-08-23"
    when: "Salary expectations / expected pay / compensation (numeric or free-text)"
    if_page_lists_a_range: >
      Type the listed minimum only (Traba 2026-08-23: page showed
      $140K–$200K → type 140000). Junyi: asking above the floor is how
      a company rejects you; do not invent a higher number.
    if_page_has_no_number: "90000"
    reason: >
      Junyi 2026-08-23 on Traba. 90k is the no-information default, not
      a target when the posting already prints a range.

written_responses:
  decided: "2026-08-23"
  revised: "2026-08-23 evening — Junyi rejected the Lila Why-us dump"
  never_click: "Simplify 'Generate with AI' (paid / subscribe). Do not click it."
  who_writes: "Cursor / this agent, after Copilot"
  answer_the_prompt:
    rule: >
      Answer the question that is on the page, in the order it is asked.
      "Why Lila, why this role, and why at this moment?" means those
      three things — not a resume, not Cannon 338, not the ideology pack
      unless that question asked for them.
    tone: "Ardent, genuine, truthful. First intern / student voice is fine."
    do_not:
      - Paste education + three projects into every Why-us
      - Recite program_end / commencement dates unless the prompt asks
      - Force the Traba week-structure ideology into a company-why box
      - Invent instrument, domain, or insider experience
    metrics_when: >
      Only when the prompt asks for examples, exceptional ability, or
      evidence. Then 1–2 evidence-bank facts, not a tour of the bank.
  if_evidence_missing: "Leave for Junyi leftover pile. Do not fabricate."
  archive: >
    Every draft goes in docs/apply/written_answers/ (one file per
    company + role + date). If Junyi rejects a draft, keep the typed
    text as historical and add a revised draft in the same file.
  ideology_for_week_or_meaning_questions: "knowledge/written_response_bank.yaml"
  prioritized_companies: >
    Same truth rules, more care. Read the JD. Say why this company and
    this role. Do not make it longer by dumping projects. See
    knowledge/application_priority.yaml.

leave_for_junyi:
  decided: "2026-08-23"
  examples:
    - interest-area / which team or section you prefer
    - any preference Copilot cannot know and evidence_bank does not cover
  later_target: >
    Most short forms filled (and later submitted only if Junyi turns that
    on). Preference leftovers stay for him. End-of-day digest: how many
    fluent, how many leftover, link to the Cloud Agent for Take Control.
    Do not send that email until Junyi confirms send. Draft only.

later_not_this_run:
  cover_letter: >
    Empty unless Junyi asks for one. Lila 2026-08-23: missing cover
    letter is expected, not a Copilot miss.
  personal_website: "Empty until a live URL exists. GitHub is already in profile.yaml."

# Trust the visible form, not the Copilot sidebar (Lila 2026-08-23 evening)
copilot_sidebar_is_not_the_form:
  decided: "2026-08-23"
  rule: >
    "Completed" on phone / phone-country / resume does not mean the
    Greenhouse widget has a number or a file. Look at the page.
    After any Run Autofill Again, re-check those three before anything
    else — Autofill can clear them while the sidebar stays green.
  especially_on: prioritized
  do_not: "Mark identity complete from the sidebar alone."

# Last gate before Submit. Simplify Copilot often skips these.
consent_checkboxes:
  decided: "2026-08-23"
  rule: >
    Click required privacy / application-statement / "I agree" squares
    every time. Do not click Submit after them unless Junyi named that
    row. Computer-use (or a later Playwright helper on the SAME Chrome
    profile) does this. Do not invent a new browser.
  do_not_click:
    - Submit
    - Apply (final)
    - MyGreenhouse login
    - EEO boxes the agent did not already decide
  how:
    - "Preferred now: computer-use clicks the visible required checkbox."
    - "Later: a small script that finds required unchecked boxes near Submit and checks them, then stops."
    - "Same Chrome profile as Copilot. Two browsers would miss the filled form."

# Export-control / ITAR "U.S. Person" (Relativity Space 2026-08-23)
us_person_export_control:
  decided: "2026-08-23"
  form_answer: "I am not a U.S. Person"
  when: >
    Export compliance / ITAR / EAR dropdown that asks whether the
    applicant is a U.S. Person (citizen, green card, asylee, refugee).
  reason: >
    Junyi is F-1. Copilot picked the U.S. Person side on Relativity.
    Computer-use must flip it. Do not pick citizen / green card /
    U.S. Person for this profile.

# "Authorized to work for any employer" (Hayden AI 2026-08-23)
authorized_for_any_employer:
  decided: "2026-08-23"
  form_answer: "leave_for_junyi"
  when: "Are you authorized to work in the United States for any employer?"
  reason: >
    Copilot answered Yes on Hayden. F-1 is not a blanket any-employer
    authorization. Do not treat that Yes as verified. Do not silently
    flip it to No. Leftover until Junyi or HIO wording is confirmed.

# Country-named sponsorship is not the US Yes-rule (Perplexity 2026-08-23)
country_specific_sponsorship:
  decided: "2026-08-23"
  when: >
    Sponsorship question names other countries only (e.g. United
    Kingdom, Germany, or Serbia) and does not ask about the United
    States.
  do_not_use: "will_require_sponsorship_now_or_future (US Yes rule)"
  reason: >
    Perplexity Search ML intern asked UK/Germany/Serbia. Copilot No.
    That is a different question from US H-1B / OPT. Do not auto-Yes.

# Do not re-run Copilot after human / computer-use corrections
do_not_run_autofill_again:
  decided: "2026-08-23"
  rule: >
    After computer-use corrects sponsorship / U.S. Person / relocate,
    do not click Simplify "Run Autofill Again". A later Autofill on
    Lila cleared Yes dropdowns to Select… and flipped Baseten
    sponsorship back to No.
  reason: "Corrections are not sticky across a second Autofill."

# Workday / ATS account walls (CVS Health 2026-08-23)
account_creation_wall:
  decided: "2026-08-23"
  do:
    - Close the tab.
    - Do not create Workday / Greenhouse / MyGreenhouse accounts.
    - Do not pick a sibling requisition from the same board.
    - Log autofill_blocked or similar in data/activity_log.csv.
  reason: "Junyi: do not create accounts during these supervised tests."

# Closed / vanished postings (Together AI 2026-08-23; will happen often)
closed_posting:
  decided: "2026-08-23"
  signals:
    - "The job you are looking for is no longer open"
    - "Greenhouse ?error=true board dump / Current openings list"
    - "404 / posting removed"
  do:
    - Close that tab. Do not stay on the employer's current-openings list.
    - Do not open a sibling job from that list.
    - Append data/job_decisions.csv with decision=closed (not pass).
    - Append data/activity_log.csv event_type=posting_closed. Do not invent a job_id.
    - Next queued URL.
  reason: >
    High-volume roles often close within minutes. The board list is not
    an application. Tracking closed URLs stops them from resurfacing.
