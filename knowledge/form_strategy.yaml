# Ashby submit-time spam wall (Charta 2026-08-24)
ashby_spam_submit_block:
  decided: "2026-08-24"
  page_copy: "We couldn't submit your application. Your application submission was flagged as possible spam."
  meaning: "Submit did not land. Not a Why-us length limit."
  do:
    - Stop retrying on the parent Cloud Chrome that already hit the wall.
    - Junyi retries from his own machine, no VPN, Copilot paused.
    - Prefer home or mobile data. Wait a few minutes.
  do_not:
    - Keep clicking Submit on the already-blocked VM
    - Invent a fingerprint or captcha bypass
    - Treat this as Ashby's recruiter-only fraud panel (that one is after a successful submit)
  exception_one_fresh_vm: "docs/experiments/2026-08-24_ashby_submit_isolation.md"
  see: "docs/apply/OBSTACLES.md"

# One authorized Cloud Submit on a NEW pod (Junyi 2026-08-24)
# Workday / ATS account walls (CVS Health 2026-08-23)
account_creation_wall:
  decided: "2026-08-23"
  do:
    - Close the tab.
    - Do not create Workday / Greenhouse / MyGreenhouse accounts.
    - Do not pick a sibling requisition from the same board.
    - Log autofill_blocked or similar in data/activity_log.csv.
  reason: "Junyi: do not create accounts during these supervised tests."

# Closed / vanished postings (Together AI 2026-08-23; will happen often)
closed_posting:
  decided: "2026-08-23"
  signals:
    - "The job you are looking for is no longer open"
    - "Greenhouse ?error=true board dump / Current openings list"
    - "404 / posting removed"
  do:
    - Close that tab. Do not stay on the employer's current-openings list.
    - Do not open a sibling job from that list.
    - Append data/job_decisions.csv with decision=closed (not pass).
    - Append data/activity_log.csv event_type=posting_closed. Do not invent a job_id.
    - Next queued URL.
  reason: >
    High-volume roles often close within minutes. The board list is not
    an application. Tracking closed URLs stops them from resurfacing.

# HOW the clicker touches the form — not new identity facts.
# Junyi leftover rules after Advanced Space redo. Identity answers stay
# in always: (disability_status) and work_authorization.yaml.
clicker_cheap_cuts:
  decided: "2026-08-25"
  source: "Junyi leftover rules after Advanced Space redo"
  what: >
    Clicker mechanics only. Copilot = Simplify Copilot sidebar, not
    Cursor and not the ATS native Autofill button.
  copilot:
    meaning: "Simplify Copilot sidebar only."
    do:
      - Click "Start Application" or "Autofill This Page" once.
      - Wait until it finishes.
    if_missing: >
      Stop and report harness_not_ready only if neither Copilot CTA is
      present. Ashby shows "Start Application" first; that is not a
      missing harness.
  never_click:
    greenhouse_native_autofill: >
      Never click Greenhouse's own "Autofill my application" /
      quick-apply. That is a login wall.
    ashby_native_autofill: >
