# Known public career-board endpoints for resolve_apply_url.py.
#
# Discovery links almost always point at Jobright, whose Apply button is a
# signup wall. This file maps employers we see repeatedly to the board the
# employer themselves publish — Greenhouse / Ashby / Lever / Workday CXS, etc.
#
# Rules:
# - Only add boards you have verified return 200 and real postings.
# - Prefer exact board IDs over guessing; a wrong board is worse than none.
# - Workday needs host (e.g. cat.wd5), tenant (cat), and site (CaterpillarCareers).
# - Never invent an apply URL that isn't on the board.

# Greenhouse board token (boards-api.greenhouse.io/v1/boards/{slug}/jobs)
greenhouse:
  Appian: appian
  Apptronik: apptronik
  Gemini: gemini
  # Google DeepMind product branding sometimes appears as Gemini on boards
  Kodiak: kodiak  # verified 2026-09-04; Winter 2027 Intern, Data Engineering 4396622009
  "Lila Sciences": lilasciences  # verified 2026-08-23
  Neuralink: neuralink
  Nirmata: nirmata
  Quantifind: quantifind  # verified 2026-09-04; Associate Data Scientist 7589899
  Relativity: relativity  # Relativity Space (Terran-R / vehicle), not e-discovery; verified 2026-08-23
  "Scale AI": scaleai  # verified 2026-08-23
  Schonfeld: schonfeld  # verified 2026-09-04; 2027 Data Science Intern 8171692
  SpaceX: spacex
  "Together AI": togetherai
  Waymo: waymo  # verified 2026-09-04; two generic Data Scientist reqs (7455592 / 8177515) — leave title-only KEEP unresolved

