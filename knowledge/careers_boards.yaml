# Known public career-board endpoints for resolve_apply_url.py.
#
# Discovery links almost always point at Jobright, whose Apply button is a
# signup wall. This file maps employers we see repeatedly to the board the
# employer themselves publish — Greenhouse / Ashby / Lever / Workday CXS, etc.
#
# Rules:
# - Only add boards you have verified return 200 and real postings.
# - Prefer exact board IDs over guessing; a wrong board is worse than none.
# - Workday needs host (e.g. cat.wd5), tenant (cat), and site (CaterpillarCareers).
# - Never invent an apply URL that isn't on the board.

