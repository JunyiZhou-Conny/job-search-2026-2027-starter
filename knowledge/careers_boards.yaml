# Known public career-board endpoints for resolve_apply_url.py.
#
# Discovery links almost always point at Jobright, whose Apply button is a
# signup wall. This file maps employers we see repeatedly to the board the
# employer themselves publish — Greenhouse / Ashby / Lever / Workday CXS, etc.
#
# Rules:
# - Only add boards you have verified return 200 and real postings.
# - Prefer exact board IDs over guessing; a wrong board is worse than none.
# - Workday needs host (e.g. cat.wd5), tenant (cat), and site (CaterpillarCareers).
# - Never invent an apply URL that isn't on the board.

# Greenhouse board token (boards-api.greenhouse.io/v1/boards/{slug}/jobs)
greenhouse:
  Apptronik: apptronik
  Nirmata: nirmata
  Appian: appian
  SpaceX: spacex
  Neuralink: neuralink
  "Together AI": togetherai
  Gemini: gemini
  # Google DeepMind product branding sometimes appears as Gemini on boards
  Relativity: relativity  # Relativity Space (Terran-R / vehicle), not e-discovery; verified 2026-08-23
  Toast: toast  # verified 2026-09-02; Summer 2027 Engineering Intern Boston gh_jid=8171800
  Nuro: nuro  # verified 2026-09-02; Software Engineer, ML Data Infrastructure gh_jid=7895818

# Ashby board slug (api.ashbyhq.com/posting-api/job-board/{slug})
ashby:
  "Bild AI": bild-ai
  Etched: etched
  Traba: traba
  OpenAI: openai
  "Charta Health": chartahealth
  Baseten: baseten
  MeshyAI: meshy  # verified 2026-08-23; includes AI Infrastructure Engineer (Bay Area)
  "Hayden AI": haydenai  # verified 2026-08-23
  KAYAK: kayak  # verified 2026-09-02; Associate Software Engineer Cambridge 1cd42283-0b84-448f-9aac-ca94b72db320 (Concord twin 8333e351 exists)

# Lever (api.lever.co/v0/postings/{slug})
lever: {}

# Workday CXS — verified hosts only.
# apply URL = https://{host}.myworkdayjobs.com/{site}{externalPath}
workday:
  "Caterpillar Inc.":
    host: cat.wd5
    tenant: cat
    site: CaterpillarCareers
  Waystar:
    host: waystar.wd1
    tenant: waystar
    site: Waystar
  NVIDIA:
    host: nvidia.wd5
    tenant: nvidia
    site: NVIDIAExternalCareerSite
  Nvidia:
    host: nvidia.wd5
    tenant: nvidia
    site: NVIDIAExternalCareerSite
  "CVS Health":
    host: cvshealth.wd1
    tenant: cvshealth
    site: CVS_Health_Careers
  Blackstone:
    host: blackstone.wd1
    tenant: blackstone
    site: Blackstone_Careers
