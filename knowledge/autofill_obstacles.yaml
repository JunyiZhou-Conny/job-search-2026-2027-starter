# Autofill obstacle notebook
# Missing facts and Copilot misses that block unattended Submit.
# Do not invent answers. Do not store SAT/ACT/GPA here until Junyi confirms
# the exact numbers for this file. Do not store ID documents.
#
# Companion (readable): docs/apply/OBSTACLES.md
# Session evidence: docs/experiments/2026-08-22_ten_tab_copilot_review.md

purpose: >
  When Copilot leaves fields empty, or the repo has a fact that Copilot did
  not use, write it here. Later we ask Junyi once, write the confirmed
  value into profile / work_authorization / evidence_bank, then Copilot
  or a later filler can use it. Empty "need review" that matches an empty
  form is working-as-designed, not a Copilot bug.

# status: missing | in_repo_unused | needs_human | observed_ok | do_not_guess

last_updated: "2026-08-24"
last_source: "Ashby isolation Submit (Anyscale Ray Core 2026-08-24) plus second 10-tab Copilot review"

# Two memories (documented 2026-08-23 after Junyi asked which "Copilot")
#
# "Copilot" in this file always means Simplify Copilot, the Chrome
# extension — not Cursor, not the Cloud Agent model.
#
# Simplify Copilot fills from the Simplify account / extension profile
# on this VM. This repo (config/profile.yaml, knowledge/) is a separate
# memory. They do not sync. A fact in git does not get typed into an ATS
# unless it is also in Simplify, or a later agent types it on purpose.
phenomena:
  - id: two_memories_repo_vs_simplify
    observed: "2026-08-23"
    company: SpaceX
    meaning: >
      Simplify Copilot left SpaceX undergraduate GPA blank. The same
      number (Emory 3.925) was already in config/profile.yaml. Cursor
      did not type the field. The extension did not read the repo.
    do_not_confuse:
      - Simplify Copilot = Chrome extension that ran Autofill This Page
      - Cursor / this agent = model that can read the repo and cannot
        assume Simplify has the same fields
    implication: >
      Putting a fact in the repo is not enough for unattended apply.
      Either add it to the Simplify profile (human, in the extension),
      or a later filler must copy a verified repo value into the widget.
      Do not invent a third number.

  - id: current_company_autofilled_harvard
    observed: "2026-08-24"
    company: Anyscale
    meaning: >
      Isolation Submit on Ashby Software Engineer (Ray Core). Copilot
      Autofill once put "Harvard University" in Current company. Standing
      answer is empty (student; do not invent an employer). Computer-use
      cleared the box before Submit. Additional information / Other were
      empty and correctly left empty.
    implication: >
      Copilot may fill school as current employer. Clear it on student
      forms. Do not Autofill Again after that correction.

  - id: leftover_typing_over_click
    observed: "2026-08-24"
    company: Charta Health
    meaning: >
      Junyi asked to paste accepted Why-us v2. First computer-use pass
      put the text in the box. The parent then launched more passes
      (Ctrl+F verify, blank-line fix). That burned tokens. Not a
      Copilot miss. See form_strategy leftover_typing_one_pass.
    implication: >
      Accepted leftover text is one paste. Do not resume the clicker
      to verify.

  - id: eeo_inconsistent_across_forms
    observed: "2026-08-23"
    meaning: >
      Same Simplify session, same day. SpaceX Hispanic/Latino was filled
      (Junyi said it looked correct: not Hispanic). Apptronik Hispanic or
      Latino was left empty. Disability filled on Apptronik. Veteran left
      empty on Apptronik (Junyi said that empty veteran field is nice).
    implication: >
      EEO autofill is not stable across Greenhouse forms. Do not treat
      one form's EEO answers as proof the next form will match. Still
      block unattended Submit when EEO is touched.

  - id: short_form_autofill_complete
    observed: "2026-08-23"
    company: Nirmata
    meaning: >
      Sidebar said Autofill complete with nothing left in need-review.
      Junyi said everything else looked perfect because the form had no
      long written-response questions.

  - id: legal_status_left_for_review_is_ok
    observed: "2026-08-23"
    company: Apptronik
    meaning: >
      Copilot listed 3 need-review items: lawful / work-authorization
      status, citizenship, and eligibility to contract with or receive
      licenses from the US government. Junyi asked if that is OK. Yes.
      Those questions need more attention than name/email. Leaving them
      empty and flagged is the desired stop, not a miss.

  - id: copilot_sets_us_citizenship
    observed: "2026-09-03"
    company: Twitch
    ats: greenhouse
    meaning: >
      Greenhouse Amazon-family form. Copilot Autofill once set "In which
      country/region do you have citizenship?" to United States of
      America. Junyi is F-1 (knowledge/work_authorization.yaml
      current_status). The value is wrong on its face even though the
      correct country is not stored in the repo. Copilot also answered the
      broad immigration sponsorship question No and "legally eligible to
      begin employment immediately" Yes (earliest start is 2027-01-18).
    implication: >
      A wrong-fact class, not a gap. Any G2 preflight must treat a
      citizenship, nationality, or export-control country widget as
      stop-the-line unless the repo holds the confirmed value and the
      clicker verifies the widget after autofill. Copilot "Completed" on
      these widgets is not a value check.
    evidence: "generated/apply_runs/2026-09-03T13/twitch/06_compensation_eeo_start.png (local; not committed)"

  - id: copilot_fills_eeo_greenhouse_amazon
    observed: "2026-09-03"
    company: Twitch
    ats: greenhouse
    meaning: >
      Copilot filled gender, Hispanic/Latino, race, and veteran status on
      the voluntary EEO block, plus disability (standing answer No). Same
      behavior as OpenAI, Nirmata, SpaceX on 2026-08-22. Values likely come
      from the Simplify profile Junyi filled in.
    implication: >
      The stop-the-line rule eeo_touched fired on a prioritized row, so
      Junyi sees it in the packet. Whether Copilot's EEO values are his own
      profile answers is a question for him, not a fact to infer.


