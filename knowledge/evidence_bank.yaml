  cellot_wyss:
    canonical_name: "speciesOT"
    title: "speciesOT. Cross-species single-cell translation with optimal transport"
    org: "Wyss Institute (Mooney Lab & Alvarez-Melis Lab)"
    role: "Graduate Researcher"
    dates: "2026-02 — present"
    dates_status: >-
      Public GitHub repo created 2026-06-09. Lab work predates the public repo.
      Resume dates stay February 2026 — present (USER_REPORTED lab start).
    source_file: "resumes/base/JZ_resume.tex"
    source_url: "https://github.com/JunyiZhou-Conny/speciesOT"
    resume_eligible: true
    current_status: >-
      Mature hub + experiment/eval/inference path on main (commit 109bf12,
      2026-09-08, Implemented R2Evaluation). A later public-package stack
      (DatasetHandle, FrozenAE, JobPlan, CellOTModel, decoded-eval wrap,
      ReferenceBundle) exists as PRs 2-10. Those classes are not on current main.
    technologies:
      ["PyTorch", "TensorFlow", "ICNN", "scGen autoencoder", "CellOT / IMPACT_CellOT",
       "Optimal Transport", "unbalanced Optimal Transport", "scanpy", "AnnData",
       "YAML experiment specs", "SLURM / FASRC Cannon", "mixhvg (via mixhvg-py)"]
    architecture: >-
      Mouse cells go through a shared scGen autoencoder latent space, then either
      a constant latent mean-shift (scGen) or an ICNN optimal-transport map
      (IMPACT_CellOT), then AE decode to a human-space prediction. Headline metric
      is frac_gap_closed_decoded (mouse-to-human MMD gap closed in the decoded
      frame), with frac_r2_closed_decoded and mean_js as guardrails. Operations
      route through ./hub. The hub prints sbatch chains and never auto-submits.
    software_engineering_evidence:
      - class: VERIFIED_IMPLEMENTED
        text: "Hub package under speciesOT/hub/ (5,254 lines across 14 modules): discover, catalog, spec, prep, backed prep, readers, render, vault, CLI."
        source: "wc -l speciesOT/hub/*.py on 109bf12"
      - class: VERIFIED_MEASURED
        text: "15 declarative experiment specs in specs/*.yaml are the intent source of truth."
        source: "ls specs/ counted 15 files"
      - class: VERIFIED_IMPLEMENTED
        text: "Decoded-frame metrics sidecar rebuilds gap-closed and R2 against AE reconstruction floors so raw-frame sign-flips are not used to rank models."
        source: "cellot/cellot_gpu/scripts/decoded_frame_metrics.py"
      - class: VERIFIED_IMPLEMENTED
        text: "Backed AnnData prep path so the documented 43 GB tabula_*_all.h5ad atlas is not full-loaded on a login node."
        source: "AGENTS.md; speciesOT/hub/prep_backed.py"
      - class: VERIFIED_IMPLEMENTED
        text: "Prediction path writes genes.txt and scgen_shift.pt sidecars with a gene-axis sha256 so a new mouse file does not reopen the ~35 MB-per-flavor training atlas or re-encode ~90k training cells. Crossing two 1,000-gene flavors is refused (they share only 721 genes)."
        source: "scripts/bake_model_artifacts.py; scripts/predict_new_input.sh comments"
      - class: VERIFIED_IMPLEMENTED
        text: "Mentor runbook for atlas-trained mouse-to-human inference on new data, CPU-only, no hub required. Drug-effect composition is explicitly not implemented."
        source: "docs/mentor_runbook.md section 1 four-corner diagram"
      - class: VERIFIED_IMPLEMENTED
        text: "Public installable package src/speciesot on main: Experiment, IdentityModel, DummyEvaluation, R2Evaluation (per-gene Pearson squared of centered matrices). Eager TrainingData/TestData still full-load h5ad."
        source: "src/speciesot/speciesot_core.py at 109bf12"
    research_evidence:
      - class: VERIFIED_MEASURED
        text: "Frozen A-D ablation (Mac Stage 1): scGen split R2-all 0.85-0.90 (Arm A 0.897 / Arm B 0.846); Bunne OOD 0.65-0.67 (Arm C 0.654 / Arm D 0.669)."
        source: "scgen-cellot-autoresearch/results/insights.md and priorities.md (public)"
        resume_ok: true
      - class: VERIFIED_MEASURED
        text: "Gene-space sign flip: 6,619 orthologs wins R2-all on the scGen split; 1k HVG wins every reported metric under Bunne OOD."
        source: "same insights.md / priorities.md"
        resume_ok: true
      - class: VERIFIED_MEASURED
        text: "Committed v08 dual scorecard has IMPACT vs scGen R2, MMD, and frac_gap_closed_decoded on several atlas cuts."
        source: "speciesOT/baseline/analysis/v08_scorecard_dual.csv"
        resume_ok: false
        note: "Public file, but these look like paper-table numbers. Keep in the bank. Do not put new unpublished-looking decimals on the resume without Junyi."
    measurable_results:
      - "scGen split (rat in train): 0.85-0.90 R^2 across all genes (Arm A 0.897, Arm B 0.846)"
      - "Bunne out-of-distribution split: 0.65-0.67 R^2 (Arm C 0.654, Arm D 0.669)"
      - "Gene-space effect sign-flips with split: 6,619 orthologs wins R^2-all on the scGen split; 1k HVG wins on all reported metrics under OOD"
    scale:
      - class: USER_REPORTED
        text: "Results tree ~2.4 GB excluded from git; fresh clone has code, not checkpoints or .h5ad payloads."
        source: "speciesOT/README.md"
      - class: USER_REPORTED
        text: "Hub docs say 180+ models across four families. Cannot live-count without the gitignored results tree."
        source: "docs/hub_usage.md"
        resume_ok: false
      - class: VERIFIED_MEASURED
        text: "184 files under docs/experiments/ (hub vault output). Do not describe these as 184 independent trained experiments."
        source: "ls docs/experiments counted 184"
        resume_ok: false
    testing_validation:
      - "No tests/ directory on current main. PR stack adds pytest files that are still off main."
      - "One unit test lives under scgen-cellot-unbalanced/scripts/test_reweight_unit.py (unbalanced-OT side path)."
    deployment: "FASRC Cannon. Two conda envs (CellOT torch 1.11 CPU; analysis scanpy >= 1.12). GPU jobs use CellOT_gpu (torch 2.x, H100/H200). Hub never auto-submits."
    strongest_accomplishments:
      - "Honest decoded-space evaluation plus a no-auto-submit experiment hub"
      - "Reusable inference path that does not drag the training atlas along"
      - "Paired scGen vs ICNN-OT comparison on a real mouse-to-human task"
    target_role_relevance:
      health_ai: "Cross-species single-cell translation, OT, atlas-scale scRNA-seq"
      ml: "ICNN OT vs additive latent shift, OOD splits, decoded-space metrics"
      ai_infra: "Hub, specs, SLURM chains, artifact-backed inference, 43 GB atlas constraint"
