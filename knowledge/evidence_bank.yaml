# Skill/project evidence. Only verified + resume_eligible items should be pushed into resumes.
# Levels: strong | working | exposure
#
# Claim classes (use on measurable_results / software_engineering_evidence when a
# number or strong verb is involved):
#   VERIFIED_MEASURED     — code, logs, tests, or committed artifacts support it
#   VERIFIED_IMPLEMENTED  — code exists and can be inspected; no measured outcome
#   USER_REPORTED         — canonical personal / README record, not re-countable here
#   PLANNED               — design, stub, or open PR. Almost never a resume bullet.
#
# Future role views (SWE / ML / AI infra / Health AI) should select from these
# records and rewrite bullets. Do not mint a second project key for the same repo.

