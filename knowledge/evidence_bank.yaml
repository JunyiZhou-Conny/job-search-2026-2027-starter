  # ---------------------------------------------------------------------------
  # Added 2026-07-26 from public GitHub READMEs. Not previously on any resume.
  # All metrics below are transcribed from the repos, not inferred.
  # ---------------------------------------------------------------------------

  autoresearch_cellot:
    title: "Autonomous Ablation-Search Agent for scGen vs CellOT"
    org: "Personal / Wyss-adjacent (FASRC Cannon cluster)"
    role: "Sole author"
    dates: "2026-06 — present"
    source_url: "https://github.com/JunyiZhou-Conny/scgen-cellot-autoresearch"
    control_logic: >-
      2026-07-26: user confirmed the reflect/decide steps are RULE-BASED (deterministic stop rules and
      thresholds in YAML), NOT LLM-driven. Do not describe this project as "agentic" or as an LLM agent —
      that implies a model in the loop and will not survive a technical screen. Use "autonomous",
      "closed-loop", or "self-directed". This project does NOT strengthen the LLM-agent skill bucket;
      airway_chatbot and vlm_textvqa_lora carry that.

      2026-07-29 SUPERSEDES THE ABOVE, PARTIALLY. Five weeks of uncommitted work was recovered from the
      Cannon working tree. The system now has three layers: L1 substrate (fixed tier ladder), L2
      `proposer.py` (deterministic adaptive one-delta search over `space.yaml`, gated by
      `policy.validate()`), and L3 `director.py` (state snapshot -> trigger detection -> agenda, with a
      PLUGGABLE reasoner). `llm_client.py` implements a real LLM policy (Anthropic/OpenAI, env-var
      credentials only) with per-call token accounting, estimated cost logging, and a hard cumulative
      spend ceiling that raises and falls back to the free rule reasoner.
      CRITICAL BOUNDARY, verified 2026-07-29: the LLM path has NEVER been exercised on real runs.
      insights.md contains exactly one director episode and it is tagged `(rule)`; research_agenda.json
      records `"reasoner": "rule"`; no LLM usage ledger file exists, so `complete()` has never logged a
      call. CLAIM: "built an optional LLM planner with cost controls and automatic fallback; the
      deterministic planner drove every run to date." DO NOT claim an LLM directed the experiments.
      The honest headline is graceful degradation and cost awareness as DESIGN, which is what applied-AI
      and agent-infra JDs screen for — not an LLM-in-the-loop result.
    technologies: ["Python", "SLURM", "FASRC Cannon", "closed-loop automation", "YAML-driven config", "job arrays", "checkpoint/resume", "Anthropic API", "OpenAI API", "token/cost accounting", "cost ceiling + graceful fallback", "agenda checkpointing", "schema migration"]
    software_engineering_evidence:
      - "Self-pacing autonomous loop: submit → watch → reflect → decide → continue → synthesize"
      - "Fairshare-aware cluster budgeting; single cluster.yaml policy drives all SLURM resourcing"
      - "Deliberately schedules CPU over GPU because GPU costs 200–500x fairshare for small MLPs"
      - "Checkpoint/resume on serial_requeue so preemption is near-free; capped concurrency via job-array %K"
      - "sshare floor makes the loop back off when the lab over-uses its share"
      - "Paired single-factor ablations: each run changes exactly one field from a frozen baseline"
      - "Modular pipeline: orchestrator, run_one_experiment (idempotent), reflect, synthesize, triage_errors"
    measurable_results:
      # Measured 2026-07-29 directly from results/experiments.csv in the Cannon working tree
      # (/n/holylabs/mooney_lab/Lab/junyizhou/speciesOT/scgen-cellot-autoresearch). Counted, not estimated.
      - "338 experiments executed; 318 status=ok, 20 status=error:CalledProcessError (94.1% completion)"
      - "79.3 hours cumulative wall-clock compute; mean run 844 s, longest run 43,254 s (12.0 h)"
      - "12 experiment tiers, 2 data splits (scgen 202 / bunne_ood 136), 7 gene-space settings (250-6,619)"
      - "experiments.csv schema migrated mid-flight from 26 to 33 columns (7 new metric fields) with safe append"
      - "L3 director: 1 logged episode, reasoner=rule. LLM reasoner implemented but never invoked (no usage ledger)."
      - "21 proposal records in results/proposals.jsonl, each carrying an explicit hypothesis and rationale"
    execution_status: >-
      2026-07-29 RESOLVED. The gap was not that the loop had not run — it was that five weeks of work
      (338 experiments plus an entire L2/L3 architecture) sat uncommitted in the Cannon working tree while
      the public repo showed a June 22 snapshot with a header-only experiments.csv.
      Infrastructure was committed and pushed as 5d1a7d9 on 2026-07-29: director.py, proposer.py,
      policy.py, llm_client.py, honest_metrics.py, explore.py, space.yaml, AUTONOMOUS_DESIGN.md (440
      lines), ae_study/ (15 files), and 12 new SLURM scripts — 45 files, ~7,500 insertions.
      DELIBERATELY WITHHELD from the public repo per user decision: results/experiments.csv,
      results/insights.md, results/proposals.jsonl, results/research_agenda.json, and adaptations.yaml.
      All five quote unpublished Mooney/Alvarez-Melis findings. The README now states execution totals
      (338 runs / 79.3 h) WITHOUT the findings, which fixes the "abandoned repo" problem while keeping
      pre-publication science private. Also excluded: results/runs/ (196 GB), results/icnn_ot/ (205 MB),
      ae_study/results/ (366 MB), .gpu_libs/, meeting_david/ (lab decks).
      OPEN: adaptations.yaml is infra-only by design but quotes two convergence figures from insights.md.
      Held back for consistency; add it if the user clears publication.
    claim_guidance: >-
      The 200-500x fairshare figure is FASRC cluster cost policy motivating a design decision, NOT a measured
      optimization the user achieved. Claim it as design rationale ("routed to CPU partitions where GPU carries
      200-500x fairshare cost"), never as "reduced cost 200-500x".
      2026-07-29 UPDATE: experiment counts and compute hours ARE now defensible — counted from
      experiments.csv (338 runs, 318 ok, 79.3 h). Savings and throughput remain NOT defensible; no
      before/after baseline was ever measured.
      Still NOT defensible: that an LLM planned or directed any experiment (see control_logic).
      Interview risk to rehearse: the public repo no longer contains experiments.csv, so an interviewer
      cannot verify the 338 figure from GitHub. Be ready to explain that results are withheld
      pre-publication and to walk through the architecture, which IS public.
    interview_depth: strong
    notes: >-
      Strongest match to the ml_systems_ai_infrastructure emerging cluster in knowledge/target_roles.yaml.
      Hits agentic pipelines, distributed scheduling, and resource-efficiency design simultaneously.

