  mixhvg_py:
    canonical_name: "mixhvg-py"
    title: "mixhvg-py — Validated Python Port of an R Bioinformatics Method"
    org: "Personal (used by speciesOT; kept separate because of GPL-3)"
    role: "Sole author"
    dates: "2026-07"
    source_url: "https://github.com/JunyiZhou-Conny/mixhvg-py"
    latest_public_commit: "e332495 2026-07-30"
    resume_eligible: true
    current_status: "Single public commit. Installable package. 68 pytest tests pass on this machine (2026-09-10)."
    technologies:
      ["Python", "NumPy", "SciPy", "AnnData", "scikit-misc loess", "pytest",
       "R / scran / Seurat reference", "GPL-3 derivative"]
    architecture: >-
      Ensemble highly variable gene selector. Each method emits a per-gene score.
      Scores become ascending ranks. Each gene keeps its maximum rank. Top nfeatures
      win. That is a union, not an average. Python API is cells x genes (AnnData).
      R is genes x cells (genes_are_rows=True).
    software_engineering_evidence:
      - class: VERIFIED_IMPLEMENTED
        text: "AnnData wrapper highly_variable_genes writes adata.var. Core API find_variable_features_mix."
        source: "src/mixhvg/__init__.py, core.py"
      - class: VERIFIED_IMPLEMENTED
        text: "Tiered fidelity: exact-by-construction ranks/normalizers (unit tests), Seurat vst via scikit-misc loess, scran modelGeneVar reimplemented and validated by agreement."
        source: "docs/fidelity.md"
      - class: VERIFIED_IMPLEMENTED
        text: "Runtime warnings pin two degenerate upstream methods (disp_lognc, disp_PFlogPF) instead of silently fixing them."
        source: "tests/test_methods.py; src/mixhvg/core.py"
    research_evidence:
      - class: VERIFIED_MEASURED
        text: "Against R 4.3.3, scran 1.30.0, Seurat 5.3.0, 400 cells x 1500 NB genes, nfeatures=500: seuratv3 and seuratv1 Spearman 1.0000 / Jaccard 1.0000; scran_pos Spearman 0.9998 / Jaccard 0.976; scran Spearman 0.979 / Jaccard 0.942."
        source: "docs/fidelity.md Measured agreement table"
        resume_ok: true
      - class: VERIFIED_MEASURED
        text: "Paper-recommended mixture (scran, seuratv1, mv_PFlogPF, scran_pos) Jaccard 0.980 at 500 genes (495/500) and 0.992 at 1000."
        source: "docs/fidelity.md"
        resume_ok: true
      - class: VERIFIED_MEASURED
        text: "mv_ct Jaccard 0.454 and mv_nc Jaccard 0.618 do not match. Exclude them. They are not in the default or recommended sets."
        source: "docs/fidelity.md"
        resume_ok: true
      - class: VERIFIED_MEASURED
        text: "A weighted-mean log-space trend correction overshot scran by ~+3.4% and raised the discarded-gene fraction from R 0.499 to 0.719. A weighted median landed at 0.503 vs R 0.499."
        source: "docs/fidelity.md The correction has to be a median, not a mean"
        resume_ok: true
      - class: VERIFIED_IMPLEMENTED
