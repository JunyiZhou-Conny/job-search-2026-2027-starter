# Recorded 2026-07-29 after an explicit discussion about how far tailoring may go.
tailoring_policy:
  encouraged:
    - "Surface real work the resume currently hides. The strongest example: JavaScript/React was
       always true of airway_chatbot but was de-emphasized because AI/ML postings care about RAG
       and LLM APIs instead. When a JD names JavaScript/TypeScript/React, promote it."
    - "Re-describe real work in the JD's vocabulary — e.g. the same SLURM orchestrator is
       'distributed scheduling', 'resource-efficiency optimization', or 'experiment infrastructure'
       depending on who is reading."
    - "List coursework-level languages on the Technical Skills line (C++, Java, R). Normal for a
       new grad and honest, provided they never appear in a bullet as accomplishments."
    - "Close a real gap by building something small and real, then claim it. Kubernetes is the
       standing example."
  not_permitted:
    - "Adding experience, projects, tools, metrics, or outcomes that did not happen, for any JD."
  rationale: >-
    Fabricated skills do not fail randomly — they fail hardest at the companies that care most
    about them, which are the same companies the fabrication attracts you toward. Concrete case
    from the 2026-07-28 discovery run: ZEDEDA posted "SWE - AI & Edge Kubernetes Orchestration"
    and Nirmata is a Kubernetes-policy company. Had Kubernetes stayed on the skills line, those
